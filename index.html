,"src":"video description (no quantities given)"},{"id":"yt-AEhBwiIEdj4","s":"y","t":"Scalloped Potato Roll","o":"Scalloped Potato Roll","c":"Tasty","cat":"Sides","st":"full","u":"https://www.youtube.com/watch?v=AEhBwiIEdj4","th":"https://i.ytimg.com/vi/AEhBwiIEdj4/mqdefault.jpg","i":["6 potatoes, peeled","2 cups grated parmesan cheese, divided","3 teaspoons salt, divided","4 tablespoons olive oil, divided","1 sweet onion, diced","1 lb ground beef","14 ½ oz diced tomato, 1 can, drained","4 tablespoons fresh parsley, chopped, divided","1 teaspoon paprika","½ teaspoon pepper","6 cups spinach","2 cloves garlic, minced","1 cup ricotta cheese","1 cup shredded mozzarella cheese"],"p":["Preheat oven to 350˚F (180˚C).","Using a knife or mandolin cut the potatoes into slices ⅛-inch (3 mm) thick.","On a parchment paper-lined baking sheet, sprinkle half of the Parmesan cheese and spread until it is evenly covering the parchment paper.","Place the potatoes over the parmesan so each potato is overlapping the previous potato both vertically and horizontally. Continue until the entire pan is filled with potatoes.","Sprinkle to rest of the Parmesan evenly over the potatoes. Season with 1 teaspoon of salt. Bake for 30 minutes, until golden and the potatoes are flexible and slightly crispy.","In a skillet heat 2 tablespoons of olive oil over medium heat. Once the oil begins to shimmer, add the onions, and cook until caramelized, about 15 minutes.","Add the beef break up and mix with the onion until cooked. Mix in the tomatoes, 3 tablespoons of parsley, paprika, 1 teaspoon of salt, and pepper. Stir, cooking until the beef is browned and cooked through. Remove from heat.","In a skillet heat 2 tablespoons of olive oil over medium heat. Add the spinach, cook until wilted. Add 1 teaspoon of salt and the garlic. Stir to combine. Remove from heat.","In a bowl combine the spinach mixture and the ricotta. Set aside.","Evenly spread the spinach mixture over the cooked potato sheet.","Evenly spread the beef mixture over the spinach. Sprinkle mozzarella over the beef.","Take one end of the potato sheet holding the parchment paper begin rolling upward, making sure the ingredients are not coming out the ends.","Once the it is completely rolled place the potato roll on the parchment paper and bake for 15 minutes.","Sprinkle with parsley for garnish. Slice and serve immediately.","Enjoy!"],"src":"linked recipe page","su":"https://tasty.co/recipe/scalloped-potato-roll","sv":"8 servings"},{"id":"yt-nzfC-rEw9h8","s":"y","t":"Secret off menu WAGYU KATSU SANDO Japanese Master Chef Masaki Sugisaki London | John Quilt","o":"Secret off menu WAGYU KATSU SANDO Japanese Master Chef Masaki Sugisaki London | John Quilter","c":"John Quilter","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=nzfC-rEw9h8","th":"https://i.ytimg.com/vi/nzfC-rEw9h8/mqdefault.jpg","i":["## Miso demi-glace sauce","2kg Sake ⁃ 40 grams Kombu","1.4kg Cherry tomato (lightly dress with olive oil then slow roast in Josper)","2kg Tomato (cut into 1/4, lightly dress with olive oil then slow roast in Josper)","1kg Onion (roughly cut into 5cm square, lightly dress with olive oil then slow roast in Josper)","1kg Wagyu beef fat (cut into 5cm cube then slow roasted in Josper)","400 grams Tomato puree","2kg Sake","300grams Haccho-miso","1kg Mirin ⁃ 400grams Tamari soy","120grams Honey","300 grams Butter","## Soba milk bread","800 gr whole milk (temperature should be between 10 and 15C)","960 gr white flour (all purpose)","100 gr powdered roasted soba","65 gr sugar","20 gr fresh yeast","20 gr salt","130 gr butter (room temperature)"],"p":["## Miso demi-glace","Soak kombu in sake and infuse for overnight.","Roast Wagyu beef fat, tomato, cherry tomato and onion in Josper as above. (Each items to be roasted separately to control timings)","Once 2 is ready, place roasted Wagyu fat with tendered fat in large pot and cook off tomato puree.","Once Tomato puree has been cooked off, add Kombu sake with Kombu. 5. Let them GENTLY simmer until all the vegetables are completely cooked to almost melting","consistency. take off kelp before it start to melt. Stir well once every 5-10 mins to avoid bottom of the pot to be burnt.","Add Haccho miso (Dark miso but NOT Sakura miso), mirin, Tamari soy and honey and mix well.","Bring them back to boil on gentle heat. Once start to boil, add butter and mix well to emulsify.","Keep simmer for further 1 hour over GENTLE heat. Stir well once every 5-10 mins to avoid bottom","of the pot to be burnt.","Blitz well with hand blender.","Pass through chinois with soft spatula. Squeeze out all possible liquid you can.","Bring them to boil again and adjust consistency and flavour.","## Soba milk bread","Mix for approx 5 min","Add","Mix for approx 3 min","Add","Mix for approx 5 min","Windowpane test","Proofing is done at room temperature for about 3h both time.","Bake at 190C for 10min with lid, then take off the lid and cook a further 25min at 180C"],"n":["The description gives the sauce and the milk bread; the wagyu katsu itself is shown only in the video."],"src":"video description"},{"id":"yt-0bihglIP42c","s":"y","t":"THE BEST MONTE CRISTO SANDWICH | SAM THE COOKING GUY 4K","o":"THE BEST MONTE CRISTO SANDWICH | SAM THE COOKING GUY 4K","c":"SAM THE COOKING GUY","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=0bihglIP42c","th":"https://i.ytimg.com/vi/0bihglIP42c/mqdefault.jpg","i":["Bread","Dijon Mustard","Egg (with Heavy Cream)","Sliced Black Forest Ham","Shredded Gruyere Cheese","## For the rub","Pork Tenderloin","Salt","Pepper","Cayenne","Chili Powder","Oregano","Avocado Oil","## For braising","Beer (I used Modelo Negro)","Butter","Worcestershire","## For the sauce","Mayo (I use Kewpie)","Avocado Oil","Garlic","Fresh Parsley"],"src":"video description (no quantities given)"},{"id":"yt-ONJoGtyIOI8","s":"y","t":"Only 3 Ingredient Double Chocolate Mousse in 20 Minutes","o":"Only 3 Ingredient Double Chocolate Mousse in 20 Minutes","c":"Spice Bangla","cat":"Desserts","st":"full","u":"https://www.youtube.com/watch?v=ONJoGtyIOI8","th":"https://i.ytimg.com/vi/ONJoGtyIOI8/mqdefault.jpg","i":["100 Grams Dark Chocolate (Semi-sweet )","100 Grams White Chocolate","500 ml Whipping Cream (200ml+300ml)"],"p":["Cut your white and dark chocolate into small pieces, then place them into two small bowls. (you can also use chocolate chips if you like)","In a small saucepan, heat the whipping cream (200ml) over medium heat just until it comes to a simmer.","Pour the hot cream directly over the chopped white and dark chocolates into 2 equal amounts and let stand for about 5 minutes to allow the hot cream to melt the chocolate.","After about 5 minutes give both the chocolate a very good stir to completely melt the chocolate.","Once the chocolate is completely melted and smooth, set aside and let it cool for 5-10 minutes.","Take a large mixing bowl and pour the 300ml very cold heavy cream.","Then, whisk the whipping cream until soft peaks form. Then, take half of the whipped cream in a separate bowl.","Add the cooled melted white chocolate mixture to the whipped cream in portions and continue to whisk until all the chocolate is mixed properly and firm peaks form.","Repeat the same process with the rest of the whipped cream and cooled melted dark chocolate mixture.","Spoon both the white and dark chocolate mousse in small serving dishes in layers, or put them into 2 piping bags and then pipe them into the serving dish to make them look fancy.","You can serve the mousse right away or refrigerate them for 3-4 hours before serving, and it is better to serve chilled.","Decorate with some chocolate sprinkles or toppings of your choice and enjoy!"],"src":"linked recipe page","su":"https://www.spicebangla.com/double-chocolate-mousse/","sv":"4 Person"},{"id":"yt-a3Oz3Vz312Y","s":"y","t":"Gordon Cooks A Curry Faster Than Getting A Take-Away | The F Word","o":"Gordon Cooks A Curry Faster Than Getting A Take-Away | The F Word","c":"The F Word","cat":"Meats","st":"link only","u":"https://www.youtube.com/watch?v=a3Oz3Vz312Y","th":"https://i.ytimg.com/vi/a3Oz3Vz312Y/mqdefault.jpg","n":["Captions only name some ingredients in passing (ginger, chillies, garlic, lemongrass, lime leaves, soy sauce, coconut, green beans, chicken) with no method; watch the video."]},{"id":"yt-GDknRmdjvTU","s":"y","t":"Get Perfectly Soft Homemade Whole Wheat Bread Every Time!","o":"Get Perfectly Soft Homemade Whole Wheat Bread Every Time!","c":"Bonita's Kitchen","cat":"Breads","st":"full","u":"https://www.youtube.com/watch?v=GDknRmdjvTU","th":"https://i.ytimg.com/vi/GDknRmdjvTU/mqdefault.jpg","i":["3 cups Warm Water","1 tbsp Yeast","1/3 cup Honey","2 tbsp Butter or margarine","1 tsp Sea salt","7 1/2 cups Whole Wheat all- purpose Flour"],"p":["1 cup of flour is 125 grams or 4 1/4 oz per cup x 7 1/2 cups, 1 tbsp yeast is 8.50 grams or 0.30 oz, Honey 1/3 cup is 80 ml, Butter 1 tbsp is 14 grams, Warm water 1 cup is = 240 ml x 3 cups = 709.765 mls.","Place warm water in glass bowl, add yeast and stir, then add honey or sugar let rise for 5 minutes","In a large bowl add 7 cups of flour, and sea salt, leaving 1/2 cup of flour for working dough.","Start to mix using a wooden spoon or kitchen aid, add yeast mixture and water, melted butter, continue mixing dough with hand and spoon. ( remember to wash your hands before and after working with dough )( Please note at this stage if you need to add more warm water to work the dough, only add at this mixing stage )","Continue mixing the 1/2 cup of flour until dough pulls away from sides mixing bowl and the dough got a elastic texture when folding together, kneading for 10 minutes to activate the yeast and form the dough ball.","After forming a ball of dough, mark the sign of a cross on the top of dough. ( Optional ) and cut a cross at the top of dough to see the texture of your dough when risen. Cover with lid and towel. Keep in a warm place in the kitchen this will make it rise faster. ( A viewer shared with us to place the bowl covered in the OVEN with the LIGHT on ONLY and set the timer, the heat from the light will keep your dough warm.)","After 20 to 30 minute or so of rising, uncover dough and knead your dough again cover and wrap with a towel and place in that warm place again for another 20 minutes or so.","After 20 minutes, put a little oil on hands and shape into small balls x 3 for one loaf bread or one long piece of dough. . Grease loaf pans adding dough to each one. Cover with parchment paper and towel the put pans in a warm place to let rise until double -- about 20 minutes.","Once dough has raised, Pre-heat oven to 350º F  then put dough in oven and set timer for 30 to 35 minutes or depending on your oven.","Check bread to see if it is baked and a nice golden top, once bread is baked, remove from oven and removing from pans unto a cooling rack.","Spread butter all over warm loaves, cover with parchment paper and towel and let cold to room temperature before bagging.","Serve with butter and jam or molasses on warm bread, only keep one loaf out at one time freeze the other two loaves in a freezer bag for another time, date and label bag.  ENJOY"],"src":"linked recipe page","su":"https://www.bonitaskitchen.com/recipe/homemade-whole-wheat-bread/","sv":"3 loafs bread"},{"id":"yt-4niCyxwxcf8","s":"y","t":"Wagyu Katsu Sandwich Recipe (牛カツサンド)","o":"Wagyu Katsu Sandwich Recipe (牛カツサンド)","c":"No Recipes","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=4niCyxwxcf8","th":"https://i.ytimg.com/vi/4niCyxwxcf8/mqdefault.jpg","i":["Vegetable oil ((for frying))","4 slices Japanese sandwich bread ((thick-cut, lightly toasted))","1/4 cup sake","1 teaspoon black pepper ((coarse grind))","1 teaspoon onion powder","1/4 teaspoon garlic powder","1/4 cup Worcestershire sauce","3 tablespoon ketchup","2 tablespoon honey","1 tablespoon whole grain mustard","1 tablespoon oyster sauce","400 grams A5 Grade Wagyu Sirloin ((2 steaks 3/4-inch thick))","1/4 teaspoon coarse sea salt","1/4 teaspoon black pepper ((coarse grind))","2 tablespoons all-purpose flour","1 large egg ((beaten))","50 grams panko ((about 1 cup))"],"p":["Fill a heavy-bottomed pot with 1 1/2 inches of Vegetable oil and preheat to 375 degrees F (190 C).","To make the Katsu Sauce, add the 1/4 cup sake, 1 teaspoon black pepper, 1 teaspoon onion powder, and 1/4 teaspoon garlic powder to a small saucepan and bring to a boil. Continue to boil until the bubbles get big and shiny.","Add the 1/4 cup Worcestershire sauce, 3 tablespoon ketchup, 2 tablespoon honey, 1 tablespoon whole grain mustard, and 1 tablespoon oyster sauce and let the mixture come to a boil again. Remove the sauce from the heat and let it cool.","For the Wagyu Katsu, beat the 1 large egg in a bowl. Add 50 grams panko to a shallow dish.","Sprinkle both sides of the 400 grams A5 Grade Wagyu Sirloin with the 1/4 teaspoon coarse sea salt and 1/4 teaspoon black pepper.","Sprinkle the steaks with the 2 tablespoons all-purpose flour and dust coat every surface of the meat with a thin, even layer. Pat the meat to dust off any excess flour.","Dip the beef in the beaten egg, coating every surface.","Place the egg and flour-coated meat on a bed of panko and it with panko, patting gently to help the panko adhere to the steak.","Add the steak to the preheated oil and fry for 30 seconds on one side. Flip the cutlet over and fry until it's golden brown (about another 30 seconds).","Transfer the fried Wagyu Katsu to a wire rack and drizzle with a generous amount of sauce. Repeat with the second cutlet.","To assemble the sandwich, place a whole Wagyu Katsu between two slices of toasted sandwich bread.","Trim off the crusts and slice the sandwich into halves or quarters."],"src":"linked recipe page","su":"https://norecipes.com/wagyu-katsu-sandwich/","sv":"2 sandwiches"},{"id":"yt-nr-zR7TMIUI","s":"y","t":"Sous Vide CRISPY EGGS Perfection! Best SOUS VIDE EGG Guaranteed","o":"Sous Vide CRISPY EGGS Perfection! Best SOUS VIDE EGG Guaranteed","c":"Sous Vide Everything","cat":"Eggs & Breakfast","st":"partial","u":"https://www.youtube.com/watch?v=nr-zR7TMIUI","th":"https://i.ytimg.com/vi/nr-zR7TMIUI/mqdefault.jpg","i":["Organic Eggs","Panko Bread Crumbs","All Purpose Flour","Salt to taste (on egg wash)","Canola Oil (for frying)"],"p":["Sous vide the eggs for 1 hr at 142°F / 61.1°C.","Bread with flour, egg wash and panko, then fry in canola oil (per ingredient list)."],"src":"video description"},{"id":"yt-rSy2pvakQ2s","s":"y","t":"Souffle Pancake With One Egg","o":"Souffle Pancake With One Egg","c":"Thy Than","cat":"Eggs & Breakfast","st":"full","u":"https://www.youtube.com/watch?v=rSy2pvakQ2s","th":"https://i.ytimg.com/vi/rSy2pvakQ2s/mqdefault.jpg","i":["1 large egg (room temperature)","2 tbsp plain flour / all purpose flour","1 tbsp milk","1.5 tbsp sugar","1/2 tsp vanilla extract","3 - 4 drops of lemon juice / vinegar (for egg stabilization - omittable)"],"p":["Scoop 2/3 of the batter into 2 pancakes","Add 2 tsp (room temperature) water, cover and cook 2 minutes","After 2 mins, scoop the rest of the batter into 2 pancakes (adding the batter into 2 batches prevents the pancakes spreading too much so they can be higher)","Reduce the heat to 3/9, add 1 tsp water, cover and cook 5 minutes","Flip the pancakes, the pancake's bottoms should be strong enough to flip easily now","Cover and cook for extra 5 mins, let them sit inside the pan for 1 minute","Serve them hot with fruit, butter and powdered sugar / syrup","For the one big pancake: Cook at 3/9 heat level for 7 minutes than flip and cook for extra 6 minutes"],"n":["Heat levels refer to the creator's 9-level electric stove; adjust for yours."],"src":"video description","sv":"2 small pancakes or 1 big pancake"},{"id":"yt-TDKEpZOu4jQ","s":"y","t":"Creamy Garlic Sauce | How To Make Recipe","o":"Creamy Garlic Sauce | How To Make Recipe","c":"Chef Jack Ovens","cat":"Sauces","st":"full","u":"https://www.youtube.com/watch?v=TDKEpZOu4jQ","th":"https://i.ytimg.com/vi/TDKEpZOu4jQ/mqdefault.jpg","i":["1 Tbsp (14ml) - Olive Oil","2 Tbsp (28g) - Clarified Unsalted Butter","1 - Small to Medium Sized Brown Onion, Finely Diced","3 Large Cloves - Garlic, Thinly Sliced (6 - 7 Cloves if you like it very strong)","2 Tbs (4g) - Flat Leaf Parsley, Chopped","2 tsp (3g) - Thyme, Chopped","2 Tbs - White Wine (Use a cheap White Wine, I used Sauvignon Blanc) It can be substituted for Vegetable Stock or Chicken Stock.","400ml - Full Fat Cream (Thickened Cream)","Salt & Pepper To Taste"],"p":["Finely dice the onion, thinly slice the garlic, chop the parsley and thyme.","Heat a heavy skillet over high heat; add the olive oil and clarified butter.","Add the onion and sweat, stirring, for 3 minutes until lightly golden and translucent.","Add the garlic and sauté 45 seconds.","Deglaze with the white wine and cook 1 minute.","Add the cream, parsley, thyme, 1 1/2 tsp sea salt flakes and 1 tsp cracked black pepper; bring to the boil.","Simmer on low for 8 minutes, stirring often; adjust seasoning and simmer 2 minutes more.","Keeps in the fridge up to 3 days; reheat gently in a pan."],"src":"video description (ingredients) + captions (method)","sv":"4"},{"id":"yt-DMQZX5fjo10","s":"y","t":"Sous Vide Short Ribs and Scallops | Surf n' Turf","o":"Sous Vide Short Ribs and Scallops | Surf n' Turf","c":"Sous Vide Everything","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=DMQZX5fjo10","th":"https://i.ytimg.com/vi/DMQZX5fjo10/mqdefault.jpg","i":["## Special sauce","1/4 Cup Sweet Onion","1/4 Cup Celery","1/4 Cup Carrots","1/4 Cup Red Wine","1 tbsp Tomato Paste","1 Bay Leaf","Demi Glaze","## Potato latkes","2 Large Potatoes","1 Egg","3 tbsp Flour","Salt and Pepper to Taste"],"src":"video description"},{"id":"yt-7ByoDLkL9Rc","s":"y","t":"Tahitian Vanilla Panna Cotta with Mango Gelee & Passion Fruit | Inspired by our Bora Bora ","o":"Tahitian Vanilla Panna Cotta with Mango Gelee & Passion Fruit | Inspired by our Bora Bora trip!!","c":"Tatyana's Everyday Food","cat":"Desserts","st":"full","u":"https://www.youtube.com/watch?v=7ByoDLkL9Rc","th":"https://i.ytimg.com/vi/7ByoDLkL9Rc/mqdefault.jpg","i":["1 ½ cups whole milk","1 ½ cups whipping cream","½ cup coconut cream/milk","½ cup white granulated sugar","2 vanilla beans","1 tbsp unflavored gelatin powder","2 tbsp water","2 medium mangos (about 2 cups fruit)","¼ cup white granulated sugar","1 tbsp lemon juice","½ to ¾ cup water","1 ½ tsp unflavored gelatin powder","2 tbsp water","5 to 6 passion fruits (for garnish)","1 cup heavy cream","½ cup confectioner’ sugar","1 tsp vanilla"],"p":["Prepare the vanilla panna cotta first. Pour the milk, cream and coconut milk into a medium sized saucepan and add the sugar. Using a paring knife, split each vanilla bean open lengthwise and scrap out the seeds with the flat edge of the knife. Add the seeds and the split vanilla beans into the milk liquids. Heat the milk and cream over medium heat for 5 to 6 minutes, until the liquids come up to a low simmer; whisk occasionally.","While the mixture is heating, prepare the gelatin. Pour the 2 tablespoons (30 ml) of water into a small ramekin and stir in the gelatin. Microwave the gelatin in 10 second intervals for about 30 seconds, until it’s completely dissolved. Immediately, pour the hot gelatin into the liquids and stir. Do not allow the gelatin to cool, it will form clumps.","Once the liquids come up to simmer, remove the pan from the heat. Pour the prepared panna cotta liquids into small glasses, parfait cups or brandy sipping glasses. Watch my video recipe to see how it’s done. This recipe will make approximately 9 small desserts or 4 to 5 larger servings. Place the cups onto a tray and transfer the vanilla panna cotta into the refrigerator to set for a couple hours.","When the panna cotta has set up slightly, prepare the mango gelee. Do not add the gelee too early, otherwise it will sink to the bottom. Peel and slice the mangos, then place into a food processor along with the sugar. Pulse for a few minutes until the mango is smooth and finely pureed. Add the lemon juice and ½ cup water at first. Pulse again and add more water if needed; the consistency shouldn’t be too thick.","Next, prepare the gelatin. Pour the 2 tablespoons (30 ml) of water into a small ramekin and stir in the gelatin. Microwave the gelatin in 10 second intervals for about 30 seconds, until it’s completely dissolved. Immediately, add the hot gelatin into the food processor and pulse with the mango. Do not allow the gelatin to cool, it will form clumps.","Gently pour the mango puree over the panna cotta. Return the dessert cups back into the refrigerator to set for 6 to 8 hours, or overnight, until firmly set.","When ready to serve, split each passion fruit in half using a serrated knife and scoop out the seeds into a small bowl using a small spoon. Add a spoonful of passion fruit seeds on top of each panna cotta.","If desired, garnish the top with whipped cream: pour chilled heavy cream into a mixing bowl and add the confectioner’s sugar and vanilla. Whisk on high speed for 3 to 4 minutes, until stiff peaks form. Transfer the whipped cream into a pastry bag with a star tip; I used a French star tip #4. Pipe small dollops of cream onto each serving.","Keep the panna cotta refrigerated."],"src":"linked recipe page","su":"https://tatyanaseverydayfood.com/mango-vanilla-panna-cotta/","sv":"8 servings"},{"id":"yt-r5kJ-NcS-6A","s":"y","t":"The Best Lemon Chicken And Chilli Chicken Recipe EVER • Taste Show","o":"The Best Lemon Chicken And Chilli Chicken Recipe EVER • Taste Show","c":"Taste Show","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=r5kJ-NcS-6A","th":"https://i.ytimg.com/vi/r5kJ-NcS-6A/mqdefault.jpg","i":["Sauce","1 tbsp. Lemon Zest","1/3 cup Lemon Juice","1/4 tsp. Salt","2 tbsp. Sugar","1/4 cup Honey","2 tbsp. White Vinegar","1 tbsp. Custard Powder","Chicken Marinade","12 oz. Chicken Breast","1/4 tsp. Ground Salt","2 tbsp. Shaoxing Wine","1  Egg","1 tbsp. Custard Powder","1 tbsp. Corn Starch","Crispy Coating","3 cup Corn Starch","1 1/2 qt. Cooking Oil"],"p":["First, cut off the ends of the lemon. Then cut it with the hob method, put the knife flat and cut the whole lemon peel forward in one direction, and then change it into small pieces. The white pulp part in the middle should be removed, because it is astringent and bitter, and then the yellow part removed is cut into filaments, and the pulp is squeezed into juice and placed in a bowl for later use.","To make the lemon sauce: Take a medium bowl, pour in the lemon juice, salt, sugar, honey, white vinegar, and custard powder. Mix well and set aside.","Cut the chicken breast: first cut the chicken breast into 3 equal parts, then cut into small pieces along the grain, about 2.5-3-inch long and 0.2-inch thick, note: do not cut too thin or it will shrink when fried.","Marinate the chicken: In a medium bowl, add salt, Shaoxing cooking wine, eggs, custard powder, and cornstarch. Mix thoroughly and evenly. Note: If you don't have Shaoxing wine, you can use beer, rice wine, low-alcohol wine, or white wine instead.","Make the crispy coating: Coat the marinated chicken with the cornstarch and shake off excess.","In a deep fryer, add oil over on high heat.  When the oil temperature reaches 325°F/170°C, turn to medium-low heat, add chicken and fry for about 1-2 minutes until lightly golden yellow, then remove.","When the oil temperature rises again, pour in the chicken again and fry for about 20-30 seconds until golden brown, then remove them from the oil.","Use a small pot, turn on medium heat, pour in the prepared lemon sauce, stir continuously and bring to a boil until thick, add half of the sliced ​​lemons.","Plate the chicken, drizzle with lemon juice, sprinkle with the remaining shredded lemon, and enjoy."],"src":"linked recipe page","su":"https://www.tastelife.tv/recipe/better-than-takeout-lemon-chicken-chef-johns-cooking-class_48686.html","sv":"2 servings"},{"id":"yt-ukTxLzz94jo","s":"y","t":"Better Than Chicken Legs!!! Everyone Was Surprised After Trying It!","o":"Better Than Chicken Legs!!! Everyone Was Surprised After Trying It!","c":"Webspoon World","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=ukTxLzz94jo","th":"https://i.ytimg.com/vi/ukTxLzz94jo/mqdefault.jpg","i":["## Flavored Breading Strips","chicken fillet - 1 kg","Olive oil - 3 tbsp.","ground black pepper - ½ tsp.","dried ginger - ½ tsp.","smoked paprika - ½ tsp.","dried garlic - 1 tsp.","soy sauce - 50 ml","walnut - 70 g","cheese - 100 g","potato chips - 70 g","flour","egg","## Chicken ala Jambalaya","hot chilly pepper - 0,5-1 pc.","cashew nuts - 50 g","tomato - 200 g","onion - 250 g","Olive oil","garlic - 3 cloves","ginger - 10 g","coriander - ½ tsp.","salt - ½ tsp.","ground black pepper - ⅓ tsp.","curry - 1 tsp.","chicken fillet - 800 g","water - 200 ml","## Cherry Smoke Chicken Breast","chicken fillet - 1 kg","Provencal herbs - 1 tsp.","smoked paprika - 1 tsp.","salt - 1 tsp.","ground black pepper - ½ tsp.","olive oil - 40 ml","charcoal","Smoking Chips (cherry)","## Crispy Minced Meat Nuggets With Cheese","chicken fillet - 1 kg","salt - 1½ tsp.","ground black pepper -1 tsp.","dill - 5 branches","cheese - 100 g","flour","egg","breadcrumbs","Olive oil","## Delicate Breasts In a Cheese-Spicy Batter","yolk - 6 pcs.","sour cream 15% - 150 g","olive oil - 30 ml","corn starch - 6 tbsp.","smoked paprika - 1 tsp.","ground black pepper - ½ tsp.","salt - 2 tsp","turmeric - 1 tsp.","garlic - 4 cloves","cheese - 100 g","olive oil","chicken fillet - 1 kg"],"src":"video description (several mini-recipes; ingredient lists only, no written method)"},{"id":"yt-QeiBeiXYBT0","s":"y","t":"Better Than KFC! THIS Is What Happened When We Mixed the Chicken and Eggs! The Best You'll","o":"Better Than KFC! THIS Is What Happened When We Mixed the Chicken and Eggs! The Best You'll Ever Eat!","c":"Webspoon World","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=QeiBeiXYBT0","th":"https://i.ytimg.com/vi/QeiBeiXYBT0/mqdefault.jpg","i":["## Chicken «Chupa Chups»","chicken wings - 1 kg","turmeric - 1 tsp","smoked paprika - 1 tsp.","dried garlic - ½ tsp.","ground black pepper  - ½ tsp.","soy sauce - 60 ml","narsharab sauce - 60 ml","egg - 1 pc.","bread crumbs - 80 g","## Chicken necks \"Surprise\"","chicken necks - 1 kg","Provencal herbs - 1 tsp.","smoked paprika - 1 tsp.","dried garlic - ½ tsp.","thyme - ½ tsp.","soy sauce - 60 ml","## Chicken thighs in plum sauce","chicken thighs - 5 pcs.","seasoning for chicken - 1 tsp.","salt - 1 tsp.","ground black pepper  - ⅓ tsp.","vegetable oil","onion - 100 g","garlic - 4 cloves","plum - 300 g","## Chicken legs \"Surprise\"","chicken legs - 8 pcs.","bell pepper - 1 pc.","tomato - 1 pc.","green onion - 2 feathers","dried garlic","salt","ground black pepper","breadcrumbs - 4 tbsp.","corn polenta - 2 tbsp","hard cheese - 40 g","egg - 1 pc.","## Sweet and sour chicken nuggets","egg - 2 pcs.","salt - 2 tsp","ground black pepper  - ½ tsp.","corn starch - 1 tbsp.","chicken fillet - 600 g","corn starch - 4 tbsp.","onion - 1 pc.","carrot - 1 pc.","garlic - 3 cloves","tomato paste - 1 tbsp","sugar - 2 tbsp.","wine vinegar - 3 tbsp."],"src":"video description (several mini-recipes; ingredient lists only, no written method)"},{"id":"yt-I_6aMZwf9CU","s":"y","t":"How to Make Perfect Chicken Manchurian Every Time","o":"How to Make Perfect Chicken Manchurian Every Time","c":"Taste Show","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=I_6aMZwf9CU","th":"https://i.ytimg.com/vi/I_6aMZwf9CU/mqdefault.jpg","i":["10 oz. Boneless, Skinless Chicken Breasts","3 cup Vegetable oil, for frying","2 tbsp. Cooking oil","1 tbsp. Fresh Garlic, minced","2 oz. Red Onion","1.5 oz. Green Bell Pepper","1.5 oz. Red Bell Pepper","1 oz. Carrots","Chicken Marinade","0.25 tsp. Salt, To Taste","2  Egg White","2 tbsp. Cornstarch","For the sauce","1 tbsp. Light Soy Sauce","0.5 tbsp. Oyster Sauce","0.5 tbsp. White Vinegar","2 tsp. Rock Sugar","0.25 cup Water","0.25 tsp. Black Pepper, to taste","1 tbsp. Cornstarch Water (2 Tbsp Cornstarch mixed with 1 Tbsp Water)"],"p":["Cut chicken breast into bite-size pieces.","In a mixing bowl, combine chicken, salt, egg white, and cornstarch. Make sure each chicken piece is nicely coated with egg white and starch mixture.","Chop bell pepper and carrot.","In a large wok over medium-high heat, heat up cooking oil to 300-350°F/150-175°C. Deep fry chicken until all pieces are floating on top and golden. Take them out and drain. For extra crunch, you can re-fry the chicken once for 40 seconds on high heat.","In a non-stick cooking pan, add garlic, onion, and cooking oil. Stir to cook until fragrant. Then, stir in green and red bell pepper, soy sauce, oyster sauce, white vinegar, rock sugar, and 1 tbsp of water. Stir and cook for a few minutes.","Add cornstarch slurry to thicken the sauce. Add chicken and mix until all pieces are well glazed.","Sprinkle some diced green onion on top. Serve immediately!"],"src":"linked recipe page","su":"https://www.tastelife.tv/recipe/chicken-manchurian_6324.html","sv":"2 servings"},{"id":"yt-R57hSkeVNG8","s":"y","t":"How to Make Perfect Fried Rice with Chicken Every Time • Taste Show","o":"How to Make Perfect Fried Rice with Chicken Every Time • Taste Show","c":"Taste Show","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=R57hSkeVNG8","th":"https://i.ytimg.com/vi/R57hSkeVNG8/mqdefault.jpg","i":["5 oz. Chicken Breast","Chicken Marinade","1 tbsp. Mirin","1 tbsp. Soy Sauce","1/2 tsp. Salt","1/2 tsp. Black Pepper","1 large Egg","For frying","4 cup Corn starch","4 tbsp. Cooking oil","Teriyaki sauce","2 tbsp. Shaoxing cooking wine","1 tbsp. Mirin","1 tbsp. Soy Sauce","1 tbsp. Sugar","1 tbsp. Honey","1/2  Lemon, juiced (to taste)","1/2 tsp. Black Pepper (to taste)","For the Fried Rice","3 large Eggs","9 oz. Brown Rice, Cooked","1 oz. Purple Cabbage","1 oz. Carrots","2 oz. Broccoli, Chopped","1 tbsp. Oyster Sauce","1 tbsp. Soy Sauce","0.5 oz. Green Onion, Chopped"],"p":["Place chicken breast on cutting board, split chicken breast horizontally into two equal pieces.","In a mixing bowl, add chicken and all marinade ingredients. Mix well.","Coat chicken pieces with starch.","In a large wok over medium heat, distribute about 4 tbsp of cooking oil. Gently place chicken into the hot wok and cook both sides until golden.","Add mirin, soy sauce, honey, sugar, lemon juice, and black pepper. Cook until chicken is covered by a layer of glazed brown sauce.","Cut chicken into small cubes and set aside.","Return wok to the stove, drizzle 3 tbsp cooking oil in the wok and spread around evenly. Scramble eggs, then add brown rice, cabbage, and carrots.","Stir fry until completely mixed. Add broccoli, chicken, oyster sauce, soy sauce, and green onion to mix.","Serve with remaining chicken on the side.","Enjoy!"],"src":"linked recipe page","su":"https://www.tastelife.tv/recipe/teriyaki-chicken-fried-rice_4023.html","sv":"2 servings"},{"id":"yt-f0yOskqCvRA","s":"y","t":"Monte Cristo sandwich Recipe","o":"Monte Cristo sandwich Recipe","c":"totikky tikky","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=f0yOskqCvRA","th":"https://i.ytimg.com/vi/f0yOskqCvRA/mqdefault.jpg","i":["3 slices white sandwich bread or any type of bread that you like and you have it.","2 slices of cooked ham","3 tablespoon grated gouda cheese, Any type of cheese, you can choose","2 eggs","3 teaspoons mayonnaise","5 tablespoons milk","A little salt to taste","1 tablespoon butter"],"p":["Cut out all 4 edges of the slices of bread.","Spread the mayonnaise onto all 3 slices of bread.","Place the shredded gouda cheese onto all 3 slices of bread.","Place 2 slices of cooked ham onto each slice of bread.","I use a cutting board to press lightly on the slices of bread, cheese and slices cooked ham. After that, turn them on top of the remaining bread.","Using the cutting board to gently press on the sandwich again.","Place 2 cups on the cutting board for about 3 to 4 minutes to make the sandwich flat.","In a bowl, crack in eggs, season with salt and spoon in the milk. Beat the ingredients until combined with a fork.","Soak the sandwich in the egg mixture.","In a flying pan, melt the butter on medium heat.","Once the butter has melted, place in the sandwich.","Grill the sandwich until golden brown on all sides for about 3 minutes per side.","Cut the Monte Cristo sandwich into triangles and serve immediately. Enjoy!"],"src":"video description"},{"id":"yt-OgonsYpLMc4","s":"y","t":"Better Than Potato Chips! TOP 7 Dinners Will Change Your Life Forever!","o":"Better Than Potato Chips! TOP 7 Dinners Will Change Your Life Forever!","c":"Webspoon World","cat":"Sides","st":"partial","u":"https://www.youtube.com/watch?v=OgonsYpLMc4","th":"https://i.ytimg.com/vi/OgonsYpLMc4/mqdefault.jpg","i":["## Glazed Bronze Potatoes","sunflower oil","potato - 500 g","honey - 2 tbsp.","sesame - 1 tbsp.","soy sauce - 2 tbsp.","garlic - 2 cloves","## Hasselback Potatoes with Green Sauce","potato - 10 pcs.","sunflower oil","sunflower oil","sunflower oil - 50 ml","dill - 8 branches","garlic - 2 cloves","salt - ½ tsp.","parmesan cheese","## Mashed Potato Sticks with Cheese","potato - 500 g","corn flour - 2 tbsp.","bread crumbs - 100 g","salt - 1 tsp.","ground black pepper  - ½ tsp.","eggs - 1 pc.","cheese - 150 g","sunflower oil","## Fragrant Potatoes with Flour Crust","flour - 100 g","turmeric - ½ tsp.","salt - 1 tsp.","Provencal herbs - 1 tsp.","potato - 1 kg","## Ruddy Potato Cheesecakes with Curd Cheese","boiled potato - 600 g","eggs - 1 pc.","flour - 2 tbsp.","salt - ½ tsp.","cheese - 125 g","ricotta cheese - 150 g","sour cream - 2 tbsp.","eggs - 1 pc.","eggs - 1 pc.","## Baked Potatoe in Semolina Breading","potato - 600 g","salt - 1 tsp.","ground black pepper  - ½ tsp.","dried dill - ½ tsp.","Italian herbs - ½ tsp.","butter (melted)","semolina","## Crushed Potatoes in \"Troubled Water\"","potato - 600 g","butter - 40 g","boiling water - 300 ml","Provencal herbs - ½ tsp.","salt - ½ tsp.","garlic - 3 cloves"],"src":"video description (several mini-recipes; ingredient lists only, no written method)"},{"id":"yt-f6079901PmU","s":"y","t":"Garlic and Herb Roast Leg of Lamb, Slow Cooked","o":"Garlic and Herb Roast Leg of Lamb, Slow Cooked","c":"Recipe30","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=f6079901PmU","th":"https://i.ytimg.com/vi/f6079901PmU/mqdefault.jpg","i":["4.5 lb (2 kg) leg of lamb, with bone","3 sprigs rosemary","6 sage leaves","1 tbsp smoked paprika","6 garlic cloves","3 tbsp olive oil","## For the gravy","3 brown onions","1 large carrot","2 celery stalks","1 1/2 cups red wine","2 cups chicken stock","30 g (1 oz) butter","2 tbsp all-purpose flour","1 tbsp mustard","Salt and pepper"],"p":["Take the lamb out of the fridge 30 minutes before cooking.","Score the fat in diamonds; rub with olive oil and season with salt, pepper and smoked paprika.","Sear all over in a roasting pan on high heat until golden; cool a little.","Cut 2 garlic cloves lengthwise into quarters; pierce 8-10 holes and insert the garlic.","Wrap short rosemary pieces in half a sage leaf and insert 10-12 into more holes.","Add sliced onions, chopped carrot and celery to the pan with 3 cups of water; set the lamb on a rack above.","Roast in a convection oven at 210°F / 100°C for about 120 minutes (about 145 minutes conventional), to 55-60°C / 130-140°F for medium rare.","Rest 30 minutes covered with foil and towels.","Simmer the pan vegetables with the red wine, chicken stock and mustard for 10 minutes.","Make a roux with the butter and flour, cook to light nutty brown and whisk into the pan to thicken; season and strain.","Carve thinly and serve with the hot gravy."],"src":"linked recipe page (Recipe30)","su":"https://www.recipe30.com/roast-leg-of-lamb-2.html/"},{"id":"yt-3j_6s6jEoBs","s":"y","t":"Fondant Potatoes","o":"Fondant Potatoes","c":"ByronTalbott","cat":"Sides","st":"full","u":"https://www.youtube.com/watch?v=3j_6s6jEoBs","th":"https://i.ytimg.com/vi/3j_6s6jEoBs/mqdefault.jpg","i":["2-3 Russet Potatoes","2-3 Large Sweet Potatoes","4-5 tbsp butter","2-3 sprigs rosemary","4-5 sprigs thyme","2 garlic cloves","1 1/2 cup chicken stock","salt and pepper"],"p":["Peel the potatoes, round off the edges into cylinders, trim top and bottom and halve to even heights.","Sear in a hot skillet with generous butter, salt, pepper, garlic, rosemary and thyme, at least 5 minutes per side until light golden.","Pour in the chicken stock and roast at 400°F for 20-25 minutes until fork tender (pull the sweet potatoes 5-7 minutes early).","Strain the stock into a saucepan and reduce.","Brown the potatoes again with more butter and aromatics, basting the tops.","Plate and drizzle with the reduced stock."],"src":"video description (ingredients) + captions (method)"},{"id":"yt-24a-TvZzfO4","s":"y","t":"Sautéed Asparagus With Cherry Tomatoes","o":"Sautéed Asparagus With Cherry Tomatoes","c":"Simply Elegant Home Cooking","cat":"Sides","st":"full","u":"https://www.youtube.com/watch?v=24a-TvZzfO4","th":"https://i.ytimg.com/vi/24a-TvZzfO4/mqdefault.jpg","i":["1/2 pound asparagus","6 ounces cherry tomatoes","2 small shallots","2 garlic cloves","1 tablespoon extra virgin olive oil","1 tablespoon butter","1 tablespoon Italian white wine vinegar","1/4 teaspoon crushed red pepper flakes","salt and pepper to taste"],"p":["Rinse and dry the cherry tomatoes and asparagus. Cut the cherry tomatoes in half with a serrated knife and remove the woody ends of the asparagus.","Crush the garlic with a garlic press and chop the shallots finely.","Preheat a large skillet on medium heat for several minutes.","Add in the olive oil and butter, then add in the shallot.","After about a minute, the butter should be melted. At this point, add the asparagus. Season with salt and pepper and stir to evenly incorporate.","The asparagus will cook for about 10 minutes. Halfway through the asparagus will turn bright green. At this point, add in the cherry tomatoes and garlic.","Several minutes after adding the garlic and tomatoes, add in the Italian white wine vinegar and crushed red pepper flakes. Stir to incorporate everything.","After a total of 10 minutes, the asparagus should be tender and the cherry tomatoes will have cooked down and concentrated in their flavor. Turn off the heat and serve!"],"src":"video description"},{"id":"yt-8p-f9DcVkgE","s":"y","t":"The BEST Beef Stew Recipe - Hundreds of 5-Star Reviews!!","o":"The BEST Beef Stew Recipe - Hundreds of 5-Star Reviews!!","c":"Tatyana's Everyday Food","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=8p-f9DcVkgE","th":"https://i.ytimg.com/vi/8p-f9DcVkgE/mqdefault.jpg","i":["2 lbs beef tri-tip (roast or short ribs)","2 tbsp cooking oil","Salt and black pepper","3 medium carrots (diced)","1 large sweet onion (diced)","3 medium celery sticks (diced)","4 garlic cloves (minced)","10 small mushrooms (sliced)","2 tbsp butter","2 tbsp all-purpose flour","1 cup red wine","1 cup tomato sauce","2 tbsp Worcestershire sauce","4 cups beef broth","2 1/2 tsp Italian herbs blend","1 tsp smoked paprika","1/2 tbsp sugar","Ground black pepper","3 to 4 cups halved baby potatoes","1 cup fresh or frozen sweet peas","2 tbsp fresh chopped parsley"],"p":["Cut the beef into 1 1/2-inch chunks. Preheat a large frying pan over medium-high heat and add a few tablespoons of oil. Once the pan is hot, add the cubed beef, season generously with salt and fry for 7 to 10 minutes, until well browned all over. Transfer the beef into a large soup pot. Deglaze the frying pan with 1/2 cup water and add the liquids to the soup pot.","Into the same frying pan, add 1 tablespoon cooking oil and the carrots, celery and onion. Saute the mixture over medium heat until the onions are translucent, about 4 to 5 minutes. Once the onion is tender, add the garlic and cook for 1 more minute. Transfer the mirepoix mixture into the soup pot. Into the frying pan, add the butter and allow it to melt before adding the mushrooms. Saute the mushrooms for 4 to 5 minutes, until well browned all over. Season the mushrooms with salt and then add the flour. Toss the mushrooms in the flour so they're evenly coated and cook for 1 minute; transfer the mushrooms into the pot.","To the soup pot, add the red wine, tomato sauce, Worcestershire, beef broth, spices and herbs. Season generously with black pepper and abou 1 1/2 tsp salt. Cover the pot with a lid and bring to a boil over high heat. Once boiling, reduce the heat to low and continue simmering the soup for 1 to 1 1/2 hours, or until the beef is tender.","Add the potatoes and frozen peas; if using fresh peas, add them 10 minutes later. Cook the potatoes for 20 minutes, or until fork tender. Garnish the stew with chopped parsley and enjoy.","Optional: for a richer stew, add the potatoes and continue cooking for an additional hour, bringing the total cooking to 2 or 2 1/2 hours."],"src":"linked recipe page","su":"https://tatyanaseverydayfood.com/beef-stew/","sv":"8 servings"},{"id":"yt-CvMXlwhcKuY","s":"y","t":"【小穎美食】土豆別炒菜了，這樣簡單一做，筋道彈牙，鮮香入味，太香了！","o":"【小穎美食】土豆別炒菜了，這樣簡單一做，筋道彈牙，鮮香入味，太香了！","c":"Xiaoying Cuisine","cat":"Sides","st":"partial","u":"https://www.youtube.com/watch?v=CvMXlwhcKuY","th":"https://i.ytimg.com/vi/CvMXlwhcKuY/mqdefault.jpg","i":["土豆 potato","胡蘿蔔 carrot","蒜薹 garlic scapes","紅椒 red pepper","豬肉 pork","澱粉 starch","鹽 salt","油 oil","黃豆醬 soybean paste","料酒 cooking wine","生抽 light soy sauce"],"src":"video description (Chinese; ingredient list only, no quantities)"},{"id":"yt-Pm0JqeChb_Q","s":"y","t":"Norwegian Butter Sauce Recipe - How to Make Sandefjordsmør","o":"Norwegian Butter Sauce Recipe - How to Make Sandefjordsmør","c":"Food Wishes","cat":"Sauces","st":"full","u":"https://www.youtube.com/watch?v=Pm0JqeChb_Q","th":"https://i.ytimg.com/vi/Pm0JqeChb_Q/mqdefault.jpg","i":["2 lemons, juiced","1/2 cup heavy cream","5 tablespoons cold unsalted, grass-fed butter, cut in cubes","Salt and cayenne to taste","2 generous tablespoons chopped Italian parsley"],"p":["Reduce the lemon juice in a saucepan on medium until almost (not quite) gone; don't let it burn.","Add the cream, raise to medium-high and reduce by about half.","Whisk in the cold butter a few cubes at a time over low heat until emulsified.","Season with salt and cayenne and stir in the parsley. Serve over fish, shrimp or lobster."],"src":"linked recipe page (Food Wishes blog, ingredients) + captions (method)","su":"https://foodwishes.blogspot.com/2017/02/norwegian-butter-sauce-better-know-as.html","sv":"4"},{"id":"yt-O8mBufgrlxI","s":"y","t":"Lachs in cremiger Tomatensauce","o":"Lachs in cremiger Tomatensauce #125","c":"KAZAN","cat":"Seafood","st":"partial","u":"https://www.youtube.com/watch?v=O8mBufgrlxI","th":"https://i.ytimg.com/vi/O8mBufgrlxI/mqdefault.jpg","i":["Salmon - 500 g.","Salt","Black pepper","Tomatoes - 300 g.","Garlic 1 clove","Cream - 150 ml. (30 - 33% fat)","Water - 50 g.","Parmesan cheese - 3 tablespoons","Parsley"],"src":"video description"},{"id":"yt-rzlqkJf0Wus","s":"y","t":"Perfect CHICKEN MANGO and AVOCADO SALAD + Easy Dressing","o":"Perfect CHICKEN MANGO and AVOCADO SALAD + Easy Dressing","c":"Natashas Kitchen","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=rzlqkJf0Wus","th":"https://i.ytimg.com/vi/rzlqkJf0Wus/mqdefault.jpg","i":["1 lb chicken breasts ((2 medium))","1/2 tsp garlic salt (or to taste)","1/8 tsp black pepper (or to taste)","2 tsp olive oil","6 cups romaine lettuce (1 head, rinsed, chopped and spun dry)","1/2 cup cherry tomatoes (halved)","1/2  english cucumber (sliced)","1  mango (pitted, peeled and diced*)","1  avocado (pitted, peeled and diced)","1/2  small purple onion (thinly sliced)","1/4 cup cilantro (chopped)","1/2 cup sliced almonds (toasted, for topping)","1/2 cup extra virgin olive oil","3 Tbsp apple cider vinegar","2 tsp dijon mustard","2 tsp honey","1  garlic clove (1 tsp minced)","1 tsp sea salt","1/4 tsp black pepper ( or to taste)"],"p":["Cut chicken breast in half lengthwise then season with garlic salt and pepper to taste and sautee in 2 tsp olive oil over medium high heat until browned and cooked through (3 min per side). Remove from the pan, cool for 5 minutes, then slice into strips against the grain.","In a large salad bowl, add chopped romaine. Top with halved cherry tomatoes, sliced cucumber, diced mango and avocado, thinly sliced purple onion, 1/4 cup cilantro (and yes cilantro can be omitted if you have a cilantro aversion).","Combine the Honey Vinaigrette Dressing Ingredients in a mason jar, cover tightly with lid and shake together until well combined. You can also mix it up in a bowl and whisk thoroughly. If not using dressing right away, shake well just before serving. Drizzle the salad dressing over the chicken mango avocado salad, adding it to taste*"],"src":"linked recipe page","su":"https://natashaskitchen.com/chicken-mango-avocado-salad/","sv":"6 people"},{"id":"yt-XxDNikjIx6U","s":"y","t":"바삭 바사삭! 놀라운 감자 팝콘!! 겉바속촉. 포테이토 팝콘.","o":"바삭 바사삭! 놀라운 감자 팝콘!! 겉바속촉. 포테이토 팝콘.","c":"쿠킹하루 Cooking Haru :)","cat":"Sides","st":"partial","u":"https://www.youtube.com/watch?v=XxDNikjIx6U","th":"https://i.ytimg.com/vi/XxDNikjIx6U/mqdefault.jpg","i":["감자 2개 (480g) — 2 potatoes (480 g)","옥수수전분 2 큰술 — 2 tbsp corn starch","소금, 후추, 파슬리 — salt, pepper, parsley"],"src":"video description (Korean)"},{"id":"yt-_XcoG970LPs","s":"y","t":"How to Make CRISPY ROAST PORK BELLY! SHOCKINGLY EASY RECIPE!","o":"How to Make CRISPY ROAST PORK BELLY! SHOCKINGLY EASY RECIPE!","c":"Cook With Mikey","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=_XcoG970LPs","th":"https://i.ytimg.com/vi/_XcoG970LPs/mqdefault.jpg","i":["1 - 3 Pound Pork belly","1 tbsp Chinese cooking wine","1 tsp salt","1 tsp sugar","1 tsp white pepper","1 tsp five spice","Rice vinegar","Baking soda","❖T-Shirt Store"],"src":"video description"},{"id":"yt-WrsZIIin8zE","s":"y","t":"Rack of lamb beginner's guide: 3 Michelin stars recipe [Hotel de Ville]","o":"Rack of lamb beginner's guide: 3 Michelin stars recipe [Hotel de Ville]","c":"Egor Appolonov","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=WrsZIIin8zE","th":"https://i.ytimg.com/vi/WrsZIIin8zE/mqdefault.jpg","i":["Rack of lamb / lamb fillet","Salt","Pepper","Peanut oil","Butter","Garlic","Rosemary","## Sauce","White wine","Shallots","Mustard","Cream"],"p":["Season with salt and pepper; sear the first side in peanut oil.","Salt both sides; add butter, garlic and rosemary.","Roast in an oven heated to the maximum (250°C) until the inside reaches 45°C (50°C maximum).","Baste with extra butter, drain the hot oil and rest 8 minutes (can be held up to 2 hours and reheated in the same oven).","Sauce: drain excess fat, add shallots and white wine, then mustard and cream."],"src":"captions (auto-subtitles) (English translation)"},{"id":"yt-HrYhZLh0jzM","s":"y","t":"Deep FRIED STEAK in America's Snack!","o":"Deep FRIED STEAK in America's #1 Snack!","c":"Sous Vide Everything","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=HrYhZLh0jzM","th":"https://i.ytimg.com/vi/HrYhZLh0jzM/mqdefault.jpg","i":["## Ritz béchamel gravy","2 tbsp Butter","5 tbsp Ritz Flour","1.5 Cup of Milk (to taste)","Pepper to Taste"],"src":"video description"},{"id":"yt-Ev911Kd99ak","s":"y","t":"Unlocking CHEESE MELTING Secrets, So Fascinating!","o":"Unlocking CHEESE MELTING Secrets, So Fascinating!","c":"Sous Vide Everything","cat":"Sauces","st":"partial","u":"https://www.youtube.com/watch?v=Ev911Kd99ak","th":"https://i.ytimg.com/vi/Ev911Kd99ak/mqdefault.jpg","i":["## Cheese sauce (with sodium citrate)","300g Cheddar Cheese","300g Milk","12g Sodium Citrate","1.5g Salt","## Melty cheeseburger patties","1 lbs Ground Beef","1 tbsp Ricotta","2 tbsp Onions","1 tbsp Garlic","4 tbsp Bread Crumbs","1 tbsp Freeze Dry Basil","2 tbsp Worcestershire Sauce","Salt and Pepper to Taste"],"n":["Sodium citrate is the \"special ingredient\"; the amount is shown in the video only."],"src":"video description"},{"id":"yt-jtvpNe1gRW8","s":"y","t":"Smoked Texas Brisket Burger with Homemade Pickles & Bacon Jam","o":"Smoked Texas Brisket Burger with Homemade Pickles & Bacon Jam","c":"allthingsbbq","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=jtvpNe1gRW8","th":"https://i.ytimg.com/vi/jtvpNe1gRW8/mqdefault.jpg","i":["4 lb brisket","1/4 cup chipotles in adobo","1 head garlic","extra virgin olive oil","2 tbsp Jacobsen Salt Co. Kosher Sea Salt","2 tbsp Jacobsen Salt Co. Tellicherry Black Peppercorns, coarse grind","8 oz Horseradish Havarti cheese","8 oz sharp cheddar","Bacon Jam (recipe below)","Pickles (recipe below)","8 Brioche buns","2 mini cucumbers, sliced 1/8”","2 jalapeños, sliced 1/8”","1/2 medium yellow onion, sliced 1/4”","3/4 cup water, plus more for boiling","3/4 cup white vinegar","1 tbsp Cattleman’s Grill Trail Dust All Purpose Seasoning","1 tsp Noble Saltworks Maple Smoked Turbinado Sugar","1 clove garlic, crushed, peeled","1 lb bacon, sliced 1/2”","1 1/2 lb yellow onion, sliced 1/4” thick","2 tbsp Cattleman’s Grill Smoky Chipotle Coffee Steak Seasoning","1 tbsp minced garlic","1/2 cup brown sugar","1/2 cup coffee","1/2 cup cider vinegar","1/2 cup maple syrup","2 tbsp TX whiskey"],"p":["To make the pickles, place the cucumbers, jalapeños and sliced onion in a pint sized mason jar. Combine the 3/4 cup water, vinegar, Cattleman’s Grill Trail Dust All Purpose Seasoning, Noble Saltworks Maple Smoked Turbinado Sugar and garlic in a small pot. Bring to a simmer. Pour over the onions in the jar. Store in the refrigerator for up to two weeks. The onions will be ready to eat after a couple of hours, but best overnight.","To make the roasted garlic, slice the tip end of the head of garlic off, exposing the cloves. Place in a Lodge 8” Cast Iron Skillet. Drizzle with extra virgin olive oil. Drizzle a few more tablespoons oil in the skillet. Cover with a lid and cook over low heat until the cloves are tender. You can flip the garlic to cook evenly. Let cook, then squeeze the cloves of garlic out of the papery skins.","To make the brisket burgers, grind brisket once with a large die. Mix garlic and chipotles in adobo into the meat. Grind again with small die. Form into 1/2 lb patties and chill.","To make the bacon jam, cook the bacon over medium heat in a Lodge dutch oven, stirring frequently until lightly browned. Remove from the dutch oven using a slotted spoon. Drain bacon on paper towels. Discard all but 2 tbsp bacon fat.","Add the sliced onions and Cattleman’s Grill 8 Second Ride Carne Asada Seasoning to the dutch oven. Cook until translucent, about 5-10 minutes. Add the garlic and brown sugar. Cook for one minute.","Add the remaining ingredients. Bring to a simmer. Return the cooked bacon to the dutch oven. Cook over low heat until the mixture is syrupy.","Transfer to a food processor and pulse to desired consistency.","Fire up the smoker! Build a charcoal base in the firebox of the Yoder Smokers Loaded Wichita Offset Smoker. Add splits of oak wood to maintain a 225-250°F temperature inside the grill.","Combine the Jacobsen Salt Co. Kosher Sea Salt and ground Jacobsen Salt Co. Tellicherry Black Pepper. Season the patties with the salt and pepper mixture.","Smoke the burgers until they reach an internal temperature of 130°F, then remove them from the grill.","Add a chimney full of hot charcoal to the firebox, right in the center. Add more oak splits to the top. Place a Yoder Smokers Cast Iron Griddle in the firebox, directly over the fire.","Sear the burgers on the hot skillet. Flip and top with the cheeses. Add a squeeze of water to the griddle and close the door to the firebox to steam the cheese. Remove when the cheese is melted and the internal temperature is 145-150°F.","To build the burgers, add the pickles to the toasted bottom bun of the brioche roll. Place the burger on the pickles. Top with bacon jam and the top bun."],"src":"linked recipe page","su":"https://www.atbbq.com/blogs/recipes/smoked-texas-brisket-burger","sv":"16"},{"id":"yt-lj9cKf86UrQ","s":"y","t":"Pratik ve Lezzetli PATLICAN KEBABI TARİFİ Patılcan Sarma Herkes Hayran Kalacak ANA YEMEK T","o":"Pratik ve Lezzetli PATLICAN KEBABI TARİFİ 😍 Patılcan Sarma 👌Herkes Hayran Kalacak ANA YEMEK TARİFİ","c":"PRATİK YEMEK TARİFLERİ","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=lj9cKf86UrQ","th":"https://i.ytimg.com/vi/lj9cKf86UrQ/mqdefault.jpg","i":["5 tane patlıcan 1,3 kilo","sıvı yağ 50 ml","3 tane patates 500 gr","8 tane domates 400 gr","4 tane yeşil biber","## Köfte için","kıyma 400 gr","1 tane soğan","3 diş sarımsak","6 yemek kaşığı galeta unu veya ekmek kırıntısı 60 gr","1 tane yumurta","1 tatlı kaşığı tuz 8 gr","1 çay kaşığı kımızı pul biber","1 çay kaşığı nane","1 çay kaşığı karabiber","## Sos için","1 yemek kaşığı salça 40 gr","1 su bardağı sıcak su 200 ml"],"p":["pişirme : 200 °C fırında 30 dakika","pişirme : 200 °C fırında 35 dakika","pişirme : 200 °C fırında 10 dakika"],"src":"video description (Turkish)"},{"id":"yt-pD157BL2QEY","s":"y","t":"Patlıcanı hiç böyle pişirdinizmi Pratik Lezzetli ve Hızlı Tarif DEĞİŞİK PATLICANTARİFİ. ŞE","o":"Patlıcanı hiç böyle pişirdinizmi Pratik Lezzetli ve Hızlı Tarif👉🏻 DEĞİŞİK PATLICANTARİFİ. ŞEKİL 3","c":"GULSUM'S PALACE TV","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=pD157BL2QEY","th":"https://i.ytimg.com/vi/pD157BL2QEY/mqdefault.jpg","i":["200 gr kıyma","1 soğan","2 diş sarımsak","1 çay kaşığı tuz","karabiber, kekik, kırmızı biber","1/2 yemek kaşığı un","3 yemek kaşığı yağ,","2 patlıcan","1 yemek kaşığı tuz","2 litre su","sos için","2 yemek kaşığı domates salçası","1/2 çay kaşığı tuz","1,5 su bardağı su ( 300 ml )","TAVADA KIZARTMAK İÇİN","Sıvı yağ"],"src":"video description (Turkish)"},{"id":"yt-ncVL5sijLnA","s":"y","t":"Blumenkohl. Keine Eier. Ohne Fleisch. Kein B paprika","## Optional","2.5 g Insta Cure #2 (colour/flavour only; reduce salt by the same amount)","## Materials","Dry aging wraps, netting"],"p":["Weigh the coppa and scale the cure to its weight.","Rub all of the cure onto the meat, bag it with any leftover spices and vacuum seal.","Refrigerate 7-21 days depending on size, turning and massaging daily.","Blot dry and mist lightly with wine or water.","Wrap in a dry aging sheet, pressing out air bubbles; net it, weigh it and record the weight.","Dry in the fridge on a rack with airflow until it loses 33-35% of its weight. Slice thinly.","To store: wash with vinegar or wine, vacuum seal whole and refrigerate (up to a year)."],"src":"linked recipe page (2 Guys & A Cooler)","su":"https://twoguysandacooler.com/spicy-capocollo/","sv":"Per 1000 g coppa (scale to your meat weight)"},{"id":"yt-W3w0YIoBY1E","s":"y","t":"I Turned Potato Into Whipped Cream Again","o":"I Turned Potato Into Whipped Cream Again","c":"acooknamedMatt","cat":"Sides","st":"partial","u":"https://www.youtube.com/watch?v=W3w0YIoBY1E","th":"https://i.ytimg.com/vi/W3w0YIoBY1E/mqdefault.jpg","i":["Idaho Yukon Gold potatoes, peeled and chopped","Flaky salt","Milk","Butter"],"p":["Boil the potatoes until tender.","In a pot, heat milk and butter; whip with the potatoes until light and fluffy, like a milkshake."],"src":"captions (auto-subtitles) (short video; no quantities spoken)"},{"id":"yt-dY_myQ_HUyo","s":"y","t":"Better Than KFC or Pizza Hut! New EGG TRICK Already Loved By The Millions!!!","o":"Better Than KFC or Pizza Hut! New EGG TRICK Already Loved By The Millions!!!","c":"Webspoon World","cat":"Eggs & Breakfast","st":"partial","u":"https://www.youtube.com/watch?v=dY_myQ_HUyo","th":"https://i.ytimg.com/vi/dY_myQ_HUyo/mqdefault.jpg","i":["## Crispy Omelette Burger","egg - 2 pcs.","cheese - 30 g","ground black pepper - ¼ tsp.","salt - ⅓ tsp.","butter","bacon","burger buns","sliced cheese","barbecue sauce","iceberg lettuce","tartar sauce","## Crispy Sausa art to 1 gallon","## Ongoing batches","1 tbsp cultured buttermilk per 1 cup milk","2 tbsp per pint","1/4 cup per quart","1 cup per gallon"],"p":["Add the starter culture powder to a fresh container of milk, close and shake for 10 seconds.","Open the lid a quarter turn for air exchange.","Leave in the warmest room (ideally 70°F or higher) for 12-24 hours until thickened like soft yoghurt.","Close tightly and refrigerate.","To keep it going, add a little of the last batch to fresh milk (amounts above), shake, loosen the lid and leave 12-24 hours; repeat at least weekly. Freezes for up to about 4 weeks."],"src":"linked recipe page (2 Guys & A Cooler)","su":"https://twoguysandacooler.com/how-to-make-cultured-buttermilk/"},{"id":"yt-3ucXLDX_xrE","s":"y","t":"How to Make the Crispiest Pork Belly Ever","o":"How to Make the Crispiest Pork Belly Ever","c":"America's Test Kitchen","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=3ucXLDX_xrE","th":"https://i.ytimg.com/vi/3ucXLDX_xrE/mqdefault.jpg","i":["1 (3-pound) skin-on center-cut fresh pork belly, about 1 1/2 inches thick","Kosher salt","2 tablespoons packed dark brown sugar","Vegetable oil"],"p":["Using sharp chef’s knife, slice pork belly lengthwise into 3 strips about 2 inches wide, then make 1/4-inch-deep crosswise cuts through skin and into fat spaced 1/2 inch apart. Combine 2 tablespoons salt and brown sugar in small bowl. Rub salt mixture into bottom and sides of pork belly (do not rub into skin). Season skin of each strip evenly with 1/2 teaspoon salt. Place pork belly, skin side up, in 13 by 9-inch baking dish and refrigerate, uncovered, for at least 12 hours or up to 24 hours.","Adjust oven rack to middle position and heat oven to 250 degrees. Transfer pork belly, skin side up, to lightly greased wire rack set in rimmed baking sheet. Roast pork belly until meat registers 195 degrees and paring knife inserted in meat meets little resistance, 3 to 3 1/2 hours, rotating sheet halfway through roasting.","Transfer pork belly, skin side up, to large plate. (Pork belly can be held at room temperature for up to 1 hour.) Pour fat from sheet into 1-cup liquid measuring cup. Add vegetable oil as needed to equal 1 cup and transfer to 12-inch skillet. Arrange pork belly, skin side down, in skillet (strips can be sliced in half crosswise if skillet won’t fit strips whole) and place over medium heat until bubbles form around pork belly. Continue to fry, tilting skillet occasionally to even out hot spots, until skin puffs, crisps, and turns golden, 6 to 10 minutes. Transfer pork belly, skin side up, to carving board and let rest for 5 minutes. Flip pork belly on its side and slice 1/2 inch thick (being sure to slice through original score marks). Reinvert slices and serve."],"src":"linked recipe page","su":"https://www.americastestkitchen.com/recipes/8116-crispy-slow-roasted-pork-belly","sv":"Serves 8 to 10"},{"id":"yt-SADycXMlQfg","s":"y","t":"Ich mache echten BACON. Sie werden den im Laden gekauften Speck für immer vergessen!","o":"Ich mache echten BACON.  Sie werden den im Laden gekauften Speck für immer vergessen!","c":"Gute Rezepte","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=SADycXMlQfg","th":"https://i.ytimg.com/vi/SADycXMlQfg/mqdefault.jpg","i":["Bruststück - 1kg 100 gr","Nitritsalz - 11 g (1% des Gewichts des Bruststücks)","Zucker - 11 g (1% des Bruststückgewichts)","Gemahlener schwarzer Pfeffer - 2 TL","Gemahlene Muskatnuss - 0,5 TL","Trockener Thymian (Thymian) gemahlen - 1 TL","Trockene Adjika - 2 TL","Lorbeerblatt - 3 Stück","Knoblauch - 3 Nelken"],"p":["Abspülen und mit Küchenpapier trocken tupfen.","In eine Tüte geben und 4 Tage kühl stellen","Drehen Sie das Brisket jeden Tag auf die andere Seite","Stellen Sie die Mindesttemperatur im Ofen ein, nicht mehr als 100 ° C","Backen, bis die Temperatur im Inneren 80 ° C erreicht","Es dauert 2,5 - 3 Stunden"],"src":"video description (German)"},{"id":"yt-uWuywALqHRc","s":"y","t":"Kohl schmeckt besser
