<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vella's Recipe Book</title>
<meta name="theme-color" content="#ffffff">
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1b1b1b;--mute:#666;--line:#e4e2dc;--acc:#b5412b;--chip:#f0eee8}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#f2f2f2;--mute:#aaa;--line:#333;--acc:#ff7a5c;--chip:#2a2a2a}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
h1{font-size:24px;margin:0 0 8px}
#q{width:100%;font-size:18px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:16px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.src{display:flex;gap:6px;align-items:center;font-size:15px;color:var(--mute);flex-wrap:wrap}
.src .chip{padding:5px 11px;font-size:14px}
main{padding:12px;max-width:1100px;margin:0 auto}
#count{color:var(--mute);font-size:15px;margin:2px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;cursor:pointer;display:flex;flex-direction:column}
.img{aspect-ratio:16/10;background:var(--chip);display:flex;align-items:center;justify-content:center;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1877f2,#0b4fb3);color:#fff;font-weight:700;font-size:15px;gap:2px;text-align:center;padding:8px}
.ph b{font-size:30px;line-height:1}
.body{padding:9px 11px 11px}
.t{font-weight:650;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c{color:var(--mute);font-size:14px;margin-top:4px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;margin-top:6px;color:#fff}
.b-y{background:#d32}.b-f{background:#1877f2}
.heart{position:absolute;top:6px;right:6px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:38px;padding:0}
.heart.on{color:#ff4d6d}
#view{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;display:none}
#view.open{display:block}
.vbar{position:sticky;top:0;display:flex;justify-content:space-between;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.vbar button{font-size:18px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.vin{max-width:760px;margin:0 auto;padding:0 0 40px}
.vimg{aspect-ratio:16/9;background:var(--chip)}
.vimg img{width:100%;height:100%;object-fit:cover;display:block}
.vtxt{padding:14px 16px}
.vtxt h2{font-size:26px;line-height:1.25;margin:4px 0 6px}
.go{display:block;text-align:center;font-size:20px;font-weight:700;padding:16px;border-radius:14px;color:#fff;text-decoration:none;margin:16px 0}
.go.y{background:#d32}.go.f{background:#1877f2}
h3{font-size:21px;margin:22px 0 8px}
ul.ing{padding-left:22px;margin:0}ul.ing li{margin:5px 0}
li.sub{list-style:none;margin-left:-22px;font-weight:700;color:var(--mute);margin-top:12px}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{counter-increment:s;position:relative;padding-left:40px;margin:12px 0}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:15px;font-weight:700;text-align:center;line-height:28px}
ol.steps li.sub{padding-left:0;counter-reset:s;font-weight:700;color:var(--mute)}ol.steps li.sub:before{display:none}
.note{background:var(--chip);border-radius:12px;padding:14px;margin:14px 0}
.small{color:var(--mute);font-size:15px}
.small a{color:var(--acc)}
#othersLink{display:block;margin:28px auto;color:var(--mute);font-size:15px;background:none;border:0;text-decoration:underline}
#others{display:none}#others.open{display:block}
#others a{display:block;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
#others small{color:var(--mute);display:block}
</style></head>

<script>window.RECIPES=[{"id":"yt-HyC8Cq7Wuk0","s":"y","t":"How To Cook A TRADITIONAL Whole Hog The Scott's Way","o":"How To Cook A TRADITIONAL Whole Hog The Scott's Way","c":"BarbecueTricks","cat":"Sauces","st":"partial","u":"https://www.youtube.com/watch?v=HyC8Cq7Wuk0","th":"https://i.ytimg.com/vi/HyC8Cq7Wuk0/mqdefault.jpg","i":["## Scott's knock-off vinegar sauce","2 cups vinegar","1/2 cup ketchup","1 tbsp fresh lemon juice","1 Tbsp red pepper","1/2 tsp black pepper","1 tsp kosher salt","1/2 tsp celery salt","1 tsp dark molasses","1 tsp sugar","1 tsp Worcestershire sauce"],"p":["Use an empty 16 oz bottle (from cider vinegar or the like) to store and serve the sauce.","Simmer the ingredients in a small to medium sauce pan for ten minutes. Let cool before serving."],"n":["Only the vinegar sauce is written out; the whole-hog cook itself is shown in the video."],"src":"linked recipe page (BarbecueTricks post linked in the description)","su":"https://barbecuetricks.com/whole-hog-at-scotts-bbq/"},{"id":"yt-cEkdCgAMgpw","s":"y","t":"How To Cure Meat in the Refrigerator","o":"How To Cure Meat in the Refrigerator","c":"LifebyMikeG","cat":"Meats","st":"link only","u":"https://www.youtube.com/watch?v=cEkdCgAMgpw","th":"https://i.ytimg.com/vi/cEkdCgAMgpw/mqdefault.jpg","n":["No recipe in the description or captions (no captions available); the description only links to the Pro Home Cooks blog homepage."]},{"id":"yt-a2-v7RDZXbc","s":"y","t":"Crispy Eggs | Byron Talbott","o":"Crispy Eggs | Byron Talbott","c":"ByronTalbott","cat":"Eggs & Breakfast","st":"full","u":"https://www.youtube.com/watch?v=a2-v7RDZXbc","th":"https://i.ytimg.com/vi/a2-v7RDZXbc/mqdefault.jpg","i":["3-4 whole eggs","3-4 cups of bread crumbs (fresh or store bought)","1 quart canola oil for frying","parsley, thyme, and rosemary are optional","Pinch of salt","White wine vinegar (for the poaching water)","Flour, plus a little milk and 1 whole egg for the egg wash"],"p":["Blend sliced bread with parsley, rosemary, thyme and a pinch of salt for 2-3 minutes until mealy.","Dry the crumbs on a tray in a 275°F oven for 10-15 minutes; cool 15 minutes.","Poach the eggs in salted water acidulated with a little white wine vinegar, about 4-5 minutes; cool 10-15 minutes.","Dredge each poached egg in flour, then egg wash (milk + whole egg), then crumbs; repeat egg wash and crumbs. Rest 5-10 minutes.","Fry in canola oil at 350°F for 2-3 minutes until dark golden. Drain on paper towel and cool 3-4 minutes."],"src":"video description (ingredients) + captions (method)"},{"id":"yt-g55zobFpHcA","s":"y","t":"Traditional Bacon Curing: No Nitrates - Just Salt","o":"Traditional Bacon Curing: No Nitrates - Just Salt","c":"The Grass-fed Homestead","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=g55zobFpHcA","th":"https://i.ytimg.com/vi/g55zobFpHcA/mqdefault.jpg","i":["Pork belly side (pastured, skin on if available)","Extra-coarse sea salt","Optional: sugar or maple sugar (see the creator's update)"],"p":["Remove any hair from the belly; cut into pieces that fit a non-metal (e.g. 9x13 Pyrex) dish.","Sprinkle an even layer of coarse salt in the dish, lay the belly fat-side down, salt the top; stack the second piece and salt it too.","Refrigerate 24 hours.","Each day, move the pieces into a fresh salted dish, swapping top and bottom, and re-salt any bare spots.","Repeat until no more liquid collects and the belly is firm (about 8 days; up to 12).","Rinse off the excess salt and pat dry.","Slice and bake at 350°F for about 25 minutes. Store in the fridge or hang in a dry, drafty place.","Creator's update (description): now re-salts only every 4th-5th day and adds maple sugar for a less salty result."],"src":"captions (auto-subtitles) + description update (no salt quantities given)"},{"id":"yt-RfG95JUR20w","s":"y","t":"THIS Is The Greatest Meat Dish Of The Year!","o":"THIS Is The Greatest Meat Dish Of The Year!","c":"Scrumdiddlyumptious","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=RfG95JUR20w","th":"https://i.ytimg.com/vi/RfG95JUR20w/mqdefault.jpg","i":["## Beef Roulade Roast","11 slices beef roulade (about 6½ lbs)","salt & pepper (to taste)","5 tbsp mustard","20 slices bacon","7 medium onions (sliced horizontally)","7 oz pickles (sliced)","oil (for frying)","7 oz carrots (finely chopped)","5 oz celery root (diced)","5 oz red onion (finely chopped)","5 oz leek (chopped)","1 tbsp tomato paste","10 fl oz red wine","2 pints broth","## Beef Wellington with Bacon and Spinach","2 lb beef tenderloin","salt & pepper (to taste)","rosemary (to taste)","1 puff pastry sheet","10 slices bacon","8 oz cooked spinach","1 whisked egg (for the egg wash)","## Smoked Pork in Puff Pastry","800 g smoked pork","150 g Black Forest ham","1 roll of puff pastry","mustard","1 egg (for glaze)","1 tbsp butter","400 g sauerkraut","100 ml stock","4 peppercorns","2 bay leaves","salt and pepper","400 g starchy potatoes (cooked)","50 g parmesan","60 g butter","1 garlic clove","nutmeg","30 ml cream","## BBQ Swineapple","1 Pineapple","7 oz Chicken Breast (in 3 strips)","10 oz Bacon","1 tsp paprika (for Chicken Breast)","1 tsp Cayenne Pepper (for Chicken Breast)","1 tsp Salt (for Chicken Breast)","1 tsp Vegetable Oil (for Chicken Breast)","2 tbsp paprika (for Pineapple)","2 tbsp Cayenne Pepper (for Pineapple)","2 tbsp Barbecue Sauce (for Bacon)","## Bacon Wrapped Meatloaf","2.25 lbs ground beef","1.33 cups breadcrumbs","1 tbsp salt","0.5 tbsp pepper","2 eggs","7 oz ham","5 oz cheese (6 slices)","3.5 oz baby spinach","14 oz bacon","## Chicken Puff Pastry","1 chicken breast","1 tbsp cream cheese","3 oz mozzarella","1 tbsp chives, chopped","4 slices prosciutto","salt and pepper","oil for frying","1 portion puff pastry dough","1 egg, beaten","## Meaty Pasta Roll","1 lb ground beef","salt (to taste)","paprika (to taste)","7 oz long macaroni or bucatini noodles","5 oz tomato sauce","2 oz chopped bell peppers (red, green and yellow)","2 oz chopped zucchini","thyme (to taste)"],"p":["## Beef Roulade Roast","For one layer, take two slices of roulade: lie them next to each other so that they partially overlap. Sprinkle them with salt and pepper before brushing them with mustard. Now place about four slices of bacon next to each other in the center where the roulades overlap. Then cover the bacon as evenly as possible with a layer of onion, followed by a layer of pickle slices. Then fold the edges of the meat over the filling, longer sides first, then the shorter, to form a rectangle.","Repeat this process four times. Build a tower of the meat layers, one on top of the other, before placing the final piece of meat on top.","Now take a long piece of cooking string and tie it around the 5 stacked roulade layers. Begin by tying a loop around one end of the layers and finishing off with a double knot with one short loose end and one long one. Take the long end of the string and wrap it around the meat again, below the first line of string. Pull the free end of the string through the loop this creates — the tension will keep the string in place. Repeat this step as you work your way down the stacked layers of meat. It is important not to make the string too tight, it just needs to hold the meat together well. When you get to the end of the meat, tie off the string but do not cut it. Turn the meat over so you can see the strings running horizontally across it. Take the free end of the string and wrap it once around each horizontal line, working your way back down. Then turn the meat over again and tie the string off (where you originally began) with a double knot, and cut away any loose ends.","Your roast should now have a 'column' of string running through the center on top and underneath. Take a second piece of string and tie it about an inch to the left of your very first knot. Work down the meat, wrapping the string once around every horizontal piece until you get to the bottom. Then flip the meat over and work your way back up, before tying off the string where you started with a double knot. Take a third piece of string and do the same on the right-hand side. When you're done, the meat should look like it is held in a net. Have a look at the video for a better idea.","Next, fry both sides of the meat in hot fat before taking it out of the dish.","You can use the same dish for the vegetables. First heat the oil in it, then add the carrots, celeriac, onion, and leek. Then add the tomato paste and mix it thoroughly with the other ingredients. Pour in the red wine, stir it well and let everything cook together. Last but not least, add the broth, cook down the sauce a little and then place the meat back in the dish.","Cover the roast and cook the whole thing in the oven for two-and-a-half hours at 320°F in a convection oven. Turn the roast occasionally during that time.","After your culinary masterpiece has left the oven, drain the vegetables with a sieve to collect the sauce and let it thicken a little. Place the vegetables around the meat, then pour the sauce on top and your feast is ready.","## Beef Wellington with Bacon and Spinach","Heat some olive oil in a pan over medium heat and season the beef tenderloin with salt, pepper, and rosemary. Place the meat in the hot pan and lightly brown it on each side for about 2 minutes.","Place the puff pastry sheet on a baking tray lined with parchment paper and arrange the bacon slices in a square on top, making sure to align the square in the center and along one of the longer sides of puff pastry. There should be a border of puff pastry around the three sides of the bacon square. Spread an even layer of cooked spinach over the bacon and place the browned beef tenderloin on top of the spinach at the point where the bacon square and puff pastry edge meet.","Brush some of the egg wash over the long puff pastry edge that is uncovered. Roll the beef tenderloin up in the puff pastry sheet. Tuck the open ends of the roll underneath and seal the edges.","Brush the rest of the egg wash over the top and sides of the roll and use a sharp knife to create a diamond pattern in the puff pastry. Transfer the baking tray to a preheated oven and cook at 350°F for 30 minutes.","## Smoked Pork in Puff Pastry","Heat butter in a pan and fry the sauerkraut. Add stock, peppercorns, bay leaves, salt, and pepper. Once cooked, let it cool.","Peel and boil the potatoes in salt water until soft. Mix with parmesan, butter, chopped garlic, and cream. Season with nutmeg, salt, and pepper. Let it cool.","Roll out the puff pastry and place two rows of ham on top, overlapping. Leave about an inch free along the edges. Cover with an even layer of mashed potato, then press and spread the sauerkraut on top.","Sear the smoked pork in a hot pan with oil on all sides. Spread mustard on all sides, place in the middle of the puff pastry, and wrap it up.","Brush egg on the outside of the puff pastry for a glaze. Bake in a convection oven at 390°F for 20 minutes.","## BBQ Swineapple","Shuck and core the pineapple, retaining the top and bottom for later use. For your final result, it's important that a sturdy cylinder of the fruit remains. Use a long knife to remove the core.","Cut the chicken breast into three equal strips and marinate in a mixture of oil, paprika, cayenne pepper, and salt.","Stuff the marinated chicken strips in the center hole of the pineapple and then season the outside walls with paprika and cayenne pepper.","Wrap the seasoned pineapple in bacon strips. You can affix these with the help of toothpicks. Next, coat the bacon strips with barbecue sauce.","Reaffix the set aside top and bottom to each end of the pineapple and secure with skewers.","Set the fully assembled pineapple on the grill and let it cook for 45 to 60 minutes.","When the juicy grilled pineapple is done, simply cut it into slices and serve. After the fruit has absorbed all that bacon flavor, get ready for an interesting fusion of sweet and smokey! Aloha!","## Bacon Wrapped Meatloaf","Mix the ground beef with breadcrumbs, salt, pepper and eggs.","Line a baking tray with aluminum foil and press the ground beef mixture into a thin, flat surface. Then add a layer each of ham, cheese, and baby spinach.","Using the aluminum foil, roll the entire sheet of beef into a giant log, sealing the ends with ground beef so the other ingredients don't seep out during cooking.","Replacing the aluminum foil flat on the baking tray, cover the entire surface with bacon, overlapping the slices so that the bacon layer forms a continuous sheet. Then place the meatloaf at one end and roll along the bacon, holding the aluminum foil as a guide, until the bacon is wrapped around the entire meatloaf.","Wrap in aluminum foil and bake at 390 °F for 60 minutes, removing the foil after 30 minutes so that the bacon crisps up nicely.","## Chicken Puff Pastry","Cut the chicken breast and fold it open. Season with salt and pepper, spread the cream cheese on one half and add the mozzarella. Sprinkle on some chives and fold it back together.","Wrap the breast in prosciutto, heat the oil in a pan and brown the wrapped breast on both sides.","Lay the chicken breast on one half of the puff pastry dough, baste the open side of the dough with egg, and cover it with the other half of the dough. Use a fork to press down the edges of the dough. Now baste the top of the pastry dough with egg. Bake in the oven for 30 minutes at 350 °F.","## Meaty Pasta Roll","Take a large piece of plastic wrap and spread the ground beef evenly over it in a rough square shape. Pat it down to give it a fairly smooth surface, suitable for covering with the macaroni noodles. Now season the meat with the salt and paprika.","Bring some water to boil in a saucepan, add some salt, then the macaroni. Let it cook for 6 minutes, then strain it through a sieve and let it drip dry.","Lay the macaroni in rows close together on top of the meat. At the side where you plan to start rolling up the meat and pasta, leave a wide gap, otherwise creating the roll will be difficult. Take care to use the food wrap to help with the rolling, so that it doesn't fall apart later.","Place the roll in a casserole dish and carefully remove the food wrap. Pour the tomato sauce evenly over the meat, then add the chopped vegetables. Garnish the whole thing with thyme leaves picked off the stalk. Bake the roll, together with the sauce and vegetables, in a convection oven at 350°F for 25-30 minutes."],"src":"linked recipe pages (7 recipes from the description)","su":"https://www.scrumdiddlyumptious.com/meat-compilation"},{"id":"yt-o_0c0-5RFXg","s":"y","t":"The GREATEST Fried Chicken Recipe IN THE WORLD!","o":"The GREATEST Fried Chicken Recipe IN THE WORLD!","c":"Eating Through Inflation","cat":"Meats","st":"link only","u":"https://www.youtube.com/watch?v=o_0c0-5RFXg","th":"https://i.ytimg.com/vi/o_0c0-5RFXg/mqdefault.jpg","n":["No captions; the description lists only Frank's RedHot sauce as an ingredient and no method."]},{"id":"yt-yrzOQ2Ssqnw","s":"y","t":"Easy Vanilla Sponge Cake Without Oven Recipe | How To Make Basic Sponge Cake | Plain Spong","o":"Easy Vanilla Sponge Cake Without Oven Recipe | How To Make Basic Sponge Cake | Plain Sponge Cake","c":"Piyas Kitchen","cat":"Desserts","st":"link only","u":"https://www.youtube.com/watch?v=yrzOQ2Ssqnw","th":"https://i.ytimg.com/vi/yrzOQ2Ssqnw/mqdefault.jpg","n":["Captions are music only; the description has no ingredient list (one tip: beat the eggs well)."]},{"id":"yt-v9nI6pdw-HQ","s":"y","t":"Jiggly Fluffy Japanese Cheese Cake","o":"Jiggly Fluffy Japanese Cheese Cake","c":"ItalyPaul Josephine ","cat":"Desserts","st":"full","u":"https://www.youtube.com/watch?v=v9nI6pdw-HQ","th":"https://i.ytimg.com/vi/v9nI6pdw-HQ/mqdefault.jpg","i":["## A","35g (5 tbsp) melted butter or corn oil","A pinch of sea salt","33g (3 tbsp) whole milk","20g (2 tbsp) sugar","54g (6 tbsp) cake flour","3 egg yolks, cold","## B","3 egg whites, cold","1/4 tsp lime or 1/2 tsp lemon juice or cream of tartar","48g (5 tbsp) sugar","## C","Softened butter, for greasing the pan","## D: decoration and filling","Cheese slices","Grated parmesan cheese"],"p":["Prepare a 6-inch cake pan (or 23 cm square pan / loaf tin): grease, line with parchment and flour.","Heat the butter or oil over low heat with the salt, milk and sugar until dissolved. Off the heat, sift in the cake flour, add the yolks and mix by hand fewer than 25 times until just combined.","Whisk the whites until foamy, add the lime/lemon juice, then the sugar a little at a time, to stiff peaks (3-5 minutes).","Fold a little meringue into the batter, then fold the batter back into the whites gently.","Pour half into the pan, add cheese slices and parmesan, top with the rest; smooth and tap out air bubbles.","Bake in a water bath at 130-150°C for about 1 hour until set in the centre.","Cool 15-20 minutes until the oven reaches 50°C; drop the pan once from a height so it doesn't shrink; cool fully before cutting. Keeps 2-3 days in the fridge."],"src":"linked recipe page (creator's blog)","su":"https://yummyeasycooking.blogspot.com/2017/08/how-to-make-soft-cheese-sponge-cake.html"},{"id":"yt-pGo-1MHk7c8","s":"y","t":"Only 2 Ingredient Chocolate Mousse Recipe Just In 15 Minutes","o":"Only 2 Ingredient Chocolate Mousse Recipe Just In 15 Minutes","c":"Spice Bangla","cat":"Desserts","st":"full","u":"https://www.youtube.com/watch?v=pGo-1MHk7c8","th":"https://i.ytimg.com/vi/pGo-1MHk7c8/mqdefault.jpg","i":["200 Grams Semi-sweet dark chocolate","400 ml Whipping cream"],"p":["Chop the dark chocolate finely and transfer it into a large mixing bowl.","Boil water in a saucepan (large enough to fit the mixing bowl) place the mixing bowl on top of the saucepan and melt the chocolate. (This technique is known as the double boiler method).","Once the chocolate has melted pour 100 ml of whipping cream on top of it (make sure that cream is at room temperature and not cold, as it might lead to the bowl breaking into pieces)","Give this a good mix using a spatula and set it aside.","Next, add the leftover whipped cream into a large mixing bowl and whisk until soft peaks form.","Now add 2-3 tablespoons of the prepared chocolate mixture into the whipping cream and whisk it well.","Repeat this process until all of the chocolate is used.","Transfer the prepared mousse into a piping bag and fill it into any fancy glasses of your choice.","Additionally, you can also, sprinkle some chocolate shreddings on top, to make it look more appealing.","Serve the prepared Mousse immediately, or refrigerate for 2-3 hours for an enhanced experience."],"src":"linked recipe page","su":"https://www.spicebangla.com/chocolate-mousse-recipe/","sv":"4 People"},{"id":"yt--3ftBTQlo0s","s":"y","t":"60 Days DRY-AGED BRISKET Experiment | GugaFoods","o":"60 Days DRY-AGED BRISKET Experiment | GugaFoods","c":"Guga Foods","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=-3ftBTQlo0s","th":"https://i.ytimg.com/vi/-3ftBTQlo0s/mqdefault.jpg","i":["Brisket (dry-aged 60 days in the video)"],"p":["I cooked it for @ (250°F / 121°C) until point temp reached 150°F / 65°C","Then I used the Texas crunch technique until point temp reached 185°F / 85°C (I usually take it out at 205F°F however it was probe tender at 185°F so it was time to take it out)","Let it rest for 2 hours in a cooler wrapped on the foil and a towel to keep it warm."],"src":"video description"},{"id":"yt-lQC2FYuyz84","s":"y","t":"I Made Real PHILLY CHEESESTEAK Better! So Easy | Guga Foods","o":"I Made Real PHILLY CHEESESTEAK Better! So Easy | Guga Foods","c":"Guga Foods","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=lQC2FYuyz84","th":"https://i.ytimg.com/vi/lQC2FYuyz84/mqdefault.jpg","i":["Ribeye steaks (choice)","White sweet onions, cut in squares","French-style bread (kept in a bag to soften) or Mallorca (pan de Mallorca) bread","Cheez Whiz (traditional version)","Provolone (second version)","Beef tallow","Salt and pepper"],"p":["Trim the hard silver skin and connective tissue from the ribeye.","Freeze about 45 minutes, then slice thin and chop finely (Pat's style, not ground).","Cook the onion squares until translucent.","Warm the Cheez Whiz slowly in a pan.","Cook the steak in beef tallow over very high heat, seasoning with salt and pepper.","Fill the bread with steak, onions and Cheez Whiz or provolone."],"src":"captions (auto-subtitles) (no quantities)"},{"id":"yt-ydd_YdWozpI","s":"y","t":"土豆秘製新吃法，軟糯香甜還拉絲，比炒土豆簡單，比吃肉還香【小穎美食】","o":"土豆秘製新吃法，軟糯香甜還拉絲，比炒土豆簡單，比吃肉還香【小穎美食】","c":"Xiaoying Cuisine","cat":"Sides","st":"partial","u":"https://www.youtube.com/watch?v=ydd_YdWozpI","th":"https://i.ytimg.com/vi/ydd_YdWozpI/mqdefault.jpg","i":["3 potatoes","2 teaspoons sugar","3 tablespoons glutinous rice flour","Cheese (for the filling)"],"p":["Peel and slice the potatoes; steam for 20 minutes.","Mash with the sugar until there are no lumps.","Add the glutinous rice flour and mix.","Shape into balls, flatten, fill with a little cheese and wrap.","Pan-fry, pressing flat, about 2 minutes per side over low heat."],"src":"captions (auto-subtitles) (English auto-translation)"},{"id":"yt-l75ixsh-wjI","s":"y","t":"The secret recipe for plant-based vegan burgers | Chef David Lee, Planta","o":"The secret recipe for plant-based vegan burgers | Chef David Lee, Planta","c":"CBC","cat":"Vegetarian Mains","st":"partial","u":"https://www.youtube.com/watch?v=l75ixsh-wjI","th":"https://i.ytimg.com/vi/l75ixsh-wjI/mqdefault.jpg","i":["Cooked black beans","Cooked lentils","Mushrooms, cooked quickly in vegetable oil","Chickpeas","Oats","Nutritional yeast","Beetroot","Tapioca starch","Salt, pepper, chili flakes","Parsley and rosemary","## To build","Mayonnaise","Lettuce","Dill pickle","Charred tomatoes","Cheese sauce","Mustard"],"p":["Pulse the beans, lentils, mushrooms, chickpeas and oats in a food processor.","Add nutritional yeast, salt, pepper, chili flakes, beets and a touch of tapioca starch; blend until it binds.","Taste; add parsley, rosemary and more heat as needed. Form patties and cook.","Build with mayo, lettuce, pickle, charred tomato, cheese sauce and mustard."],"src":"captions (auto-subtitles) (no quantities spoken)"},{"id":"yt-jDq269e6w_c","s":"y","t":"HOW TO MAKE HOMEMADE BUTTER IN 3 MINUTES RECIPE","o":"HOW TO MAKE HOMEMADE BUTTER IN 3 MINUTES RECIPE","c":"SimpleCookingChannel","cat":"Condiments","st":"full","u":"https://www.youtube.com/watch?v=jDq269e6w_c","th":"https://i.ytimg.com/vi/jDq269e6w_c/mqdefault.jpg","i":["600 ml pure cream (about 40% fat)"],"p":["Beat the cream with a hand mixer on low until it thickens (about 20 seconds), then on high for about 3 minutes until it splits into butter and buttermilk.","Pour off the buttermilk.","With clean hands, squash the butter together and squeeze out the remaining buttermilk.","Press into a container, cover and refrigerate; use within two weeks."],"src":"video description (ingredient) + captions (method)"},{"id":"yt-4RwuSZDl_do","s":"y","t":"Italian Grandma Makes Canned Tomato Puree","o":"Italian Grandma Makes Canned Tomato Puree","c":"Buon-A-Petitti","cat":"Sauces","st":"link only","u":"https://www.youtube.com/watch?v=4RwuSZDl_do","th":"https://i.ytimg.com/vi/4RwuSZDl_do/mqdefault.jpg","n":["No captions; the description has no recipe text."]},{"id":"yt-FLd00Bx4tOk","s":"y","t":"How to make Pancakes | Fluffy Pancake Recipe","o":"How to make Pancakes | Fluffy Pancake Recipe","c":"Recipes by Carina","cat":"Eggs & Breakfast","st":"full","u":"https://www.youtube.com/watch?v=FLd00Bx4tOk","th":"https://i.ytimg.com/vi/FLd00Bx4tOk/mqdefault.jpg","i":["1½ Cups | 190g Flour","4 Teaspoons Baking Powder","Pinch of Salt","2 Tablespoons Sugar (optional)","1 Egg","1¼ Cups | 310ml Milk","¼ Cup | 60g Melted Butter + more for cooking","½ Teaspoon Vanilla Essence"],"p":["In a large bowl mix together the flour, baking powder and salt with a wooden spoon. Set to the side.","In a smaller bowl crack in the egg and pour in the milk.","Add the melted butter and vanilla essence to the egg and milk and use a fork to mix together until everything is well combined.","Make a well in the dry ingredients and pour in the wet. Fold the batter together with a wooden spoon until there are no longer any large lumps.","To cook the pancakes heat a heavy based pan like cast iron over medium low heat. When the pan is hot add a small amount of butter and ⅓ cup of the pancakes batter.","Cook the pancake for 2-3 minutes each side. Repeat with remaining batter.","Serve the pancakes stacked high with butter and maple syrup. Enjoy."],"n":["You can add other flavourings to the pancakes such as blueberries or chocolate chips. Add the extra ingredients at the same time as you combine the wet and dry ingredients."],"src":"video description"},{"id":"yt-vk3FaIZhRS0","s":"y","t":"HOW TO CURE COUNTRY HAM THE OLD TIME APPALACHIAN WAY..WITH A MODERN TWIST!","o":"HOW TO CURE COUNTRY HAM THE OLD TIME APPALACHIAN WAY..WITH A MODERN TWIST!","c":"Stoney Ridge Farmer","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=vk3FaIZhRS0","th":"https://i.ytimg.com/vi/vk3FaIZhRS0/mqdefault.jpg","i":["Salt-cured hams (out of the salt box)","Liquid smoke","Water","Brown sugar (or honey or white sugar)","Red pepper (ground)","Black pepper"],"p":["Take the cured hams out of the salt box and rinse off the salt.","Brush with a sticky mixture of liquid smoke, a little water and brown sugar (about half as thick as honey).","Coat with red pepper, then dust heavily with black pepper.","Smoke, bag and hang in the smokehouse to cure out for 12-18 months (per the description)."],"src":"captions (auto-subtitles) + description (only the post-salt stage; no quantities)"},{"id":"yt--vgUjFD3ksY","s":"y","t":"Texas Brisket - Easiest Smoked Brisket Recipe Ever!","o":"Texas Brisket - Easiest Smoked Brisket Recipe Ever!","c":"White Thunder BBQ","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=-vgUjFD3ksY","th":"https://i.ytimg.com/vi/-vgUjFD3ksY/mqdefault.jpg","i":["1 Brisket","Salt","Black Pepper","Wood for smoking - I used Hickory and Apple (would have preferred oak on this one)"],"p":["Mix salt and pepper.  60% Salt and 40% Pepper.  Sprinkle all over the brisket.","Stabilize grill temperature at 250.  Cook for about an hour a pound.  Wrap if the skin is getting dark.  Cook until a toothpick slides right in."],"src":"video description (same text on the creator's blog post)","su":"https://whitethunderbbq.blogspot.com/2014/10/texas-brisket-easiest-brisket-recipe.html"},{"id":"yt-qHl1MoXPXz0","s":"y","t":"FISH AND CHIPS | Hands down the best ever | John Quilter","o":"FISH AND CHIPS | Hands down the best ever | John Quilter","c":"John Quilter","cat":"Seafood","st":"partial","u":"https://www.youtube.com/watch?v=qHl1MoXPXz0","th":"https://i.ytimg.com/vi/qHl1MoXPXz0/mqdefault.jpg","i":["## Fish and chips","Vodka","IPA Beer","Self raising Flour","Rice Flour","Pollock / Cod / coley","Salt","Maris piper potatoes","Beef dripping","2 x lemons","## Tartar sauce","Soft boiled eggs","Capers","Gherkins","Parsley","Shallots","Mayo","Lemon","## Mushy peas","Mint","Lemon","Shallots","Frozen peas","Cream","Malt Vinegar","Salt","Pepper"],"src":"video description"},{"id":"yt-iM_KMYulI_s","s":"y","t":"Gordon Ramsay's perfect burger tutorial | GMA","o":"Gordon Ramsay's perfect burger tutorial | GMA","c":"Good Morning America","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=iM_KMYulI_s","th":"https://i.ytimg.com/vi/iM_KMYulI_s/mqdefault.jpg","i":["Ground chuck","Ground brisket","A touch of egg","Salt and pepper","Grapeseed oil","Butter (for brushing)","Burger buns","Cheddar cheese","Light mustard mayonnaise","Lettuce","Tomato","Onions (sliced and grilled)"],"p":["Season the chuck and brisket, combine and bind with a touch of egg; form patties the day before and chill.","Don't cook them ice cold. Oil and season the patties, rolling the seasoning around the edges.","Grill on the hottest spot, lid down, moving them as little as possible; about 3 1/2-4 minutes per side.","Grill seasoned onion slices whole and toast both sides of the buns.","Brush the burgers with butter 2 minutes before they come off; season again; add cheddar 30 seconds before.","Assemble: mayo, lettuce, seasoned tomato, more mayo, burger, grilled onions, top bun."],"src":"captions (auto-subtitles) (no quantities spoken)"},{"id":"yt-pAWduxoCgVk","s":"y","t":"How to Make Perfect Poached Eggs - 3 Ways | Jamie Oliver","o":"How to Make Perfect Poached Eggs - 3 Ways | Jamie Oliver","c":"Jamie Oliver","cat":"Eggs & Breakfast","st":"partial","u":"https://www.youtube.com/watch?v=pAWduxoCgVk","th":"https://i.ytimg.com/vi/pAWduxoCgVk/mqdefault.jpg","i":["Very fresh eggs","Water","## Serving idea","Asparagus, dressed with oil, salt and lemon juice","Parmesan","## Cling-film method","Food-safe cling film","A little oil","Optional: chopped herbs, harissa"],"p":["## Basic","Bring water to the boil, then take it off so the bubbles subside.","Crack in a very fresh egg and poach about 3 minutes for a softish egg; check it feels like fresh springy mozzarella.","## Swirl","Spin the water with a spoon and drop the egg into the middle.","## Cling film (for 5-6 eggs)","Line a small bowl with oiled cling film, crack in the egg (add herbs or harissa if you like), twist and knot.","Poach in the bag, then snip it open."],"src":"captions (auto-subtitles)"},{"id":"yt-ZnDjb8dSBF4","s":"y","t":"Apple-Smoked Cured Pork Belly, aka homemade bacon","o":"Apple-Smoked Cured Pork Belly, aka homemade bacon","c":"Smo'King BBQ Tips & Recipes","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=ZnDjb8dSBF4","th":"https://i.ytimg.com/vi/ZnDjb8dSBF4/mqdefault.jpg","i":["1/2 cup kosher salt","1/2 cup apple butter","1/4 cup firmly packed brown sugar","1 Tablespoon ground cinnamon","1/2 teaspoon ground nutmeg","1/2 teaspoon ground cloves","1/2 teaspoon allspice","1 teaspoon curing salt","4-5 pound pork belly (skin removed)"],"p":["In a bowl combine the salt, apple butter, brown sugar, cinnamon, nutmeg, cloves and curing salt.","Put the pork belly in a 2 gallon zip-top bag.  With the fat side up apply 1/3 of the paste, and rub in.  Turn the pork belly over and apply the remaining paste and rub in.  Seal the bag and place in the refrigerator for 7 days. Turn the pork belly over once a day.","After 7 days remove the pork from the bag and rinse off with cold water. Slice off a small piece and fry to taste for salt content.  If too salty soak in cold water for 2 hours.","After pork belly has been rinsed and soaked, dry off and place it on back in the refrigerator overnight to dry out. This process will allow the meat to form a thin coating called a pellicle, which will allow the smoke to stick to the pork.","Heat up the smoker using apple wood to 190-225 degrees.  Cook the pork belly fat side down for 2-3 hours, or until internal temperature reaches 150 degrees.","Remove the pork belly and let cool.  From this point you can slice it up and cook it, or wrap it in plastic wrap and store in the fridge for up to 10 days.  Frozen it can last for 3 months."],"src":"video description"},{"id":"yt-1QqYdUtNyN4","s":"y","t":"How to Make Capicola at Home! (Umai Dry Charcuterie)","o":"How to Make Capicola at Home! (Umai Dry Charcuterie)","c":"Ballistic BBQ","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=1QqYdUtNyN4","th":"https://i.ytimg.com/vi/1QqYdUtNyN4/mqdefault.jpg","i":["Coppa muscle from a Boston butt pork shoulder (about 4 1/2 lb)","## Cure (for a ~4.5 lb coppa)","6 tablespoons (60 g) kosher salt (3% of meat weight)","2 tablespoons white sugar","1 teaspoon (6 g) Cure #2 (pink salt)","2 tablespoons coarsely ground pepper","1 tablespoon (4 g) crushed juniper berries","2 dried bay leaves, crumbled (about 2 g)","1/2 teaspoon (1 g) freshly grated nutmeg","2-3 sprigs (3 g) fresh thyme","2 cloves garlic, coarsely minced","## Coating","1 cup paprika","About 1 tablespoon chipotle powder","## Equipment","Umai Dry charcuterie bag and VacMouse, vacuum sealer, butcher's twine"],"p":["Remove the coppa muscle from the pork shoulder by following the seam of fat; trim loose ends.","Weigh the meat (cure amounts are proportional to weight).","Blend the cure ingredients in a food processor and rub all over the meat.","Vacuum seal and cure in the fridge for 1 week.","Rinse under cold water and pat dry.","Coat with the paprika-chipotle mix, tie with butcher's twine and wipe off excess paprika.","Put in the Umai dry bag with a VacMouse and vacuum seal (moist setting, or seal twice).","Dry on a wire rack in the fridge until it loses 35% of its weight (start weighing at about 4 weeks; 6-8 weeks total, 7 here).","Unwrap, remove the twine and slice thinly."],"src":"captions (auto-subtitles)"},{"id":"yt-BF6pomWXxes","s":"y","t":"The Crispy Potato Stack","o":"The Crispy Potato Stack","c":"ByronTalbott","cat":"Sides","st":"partial","u":"https://www.youtube.com/watch?v=BF6pomWXxes","th":"https://i.ytimg.com/vi/BF6pomWXxes/mqdefault.jpg","i":["Russet potatoes","Grapeseed oil (for frying)","Salt","Ketchup or your favourite dip (to serve)"],"p":["Heat grapeseed oil (pot about one third full) to 350-375°F.","Slice russet potatoes thinly on a mandoline (skip the ends). Do not rinse or soak them.","Align the centre slices into a stack, trim to a rectangle and cut in half into square stacks (work within 30-40 minutes before they brown).","Fry a few stacks at a time at about 350°F for about 5 minutes until golden.","Salt as they come out and serve with a dip."],"src":"captions (auto-subtitles) (description ingredient list is empty; no quantities)"},{"id":"yt-3yX_bpbCmfo","s":"y","t":"This Burger CHANGED MY LIFE, So EASY!","o":"This Burger CHANGED MY LIFE, So EASY!","c":"Guga Foods","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=3yX_bpbCmfo","th":"https://i.ytimg.com/vi/3yX_bpbCmfo/mqdefault.jpg","i":["## Burger sauce","1 part Ketchup","3/4 part Mayo","1/4 part Mustard","1/4 part Brazilian Hot Sauce"],"n":["The description says to make Guga's buns (see the Hamburger Buns card)."],"src":"video description"},{"id":"yt-4I0sjituOzM","s":"y","t":"EASY Homemade BACON, Step by Step to Perfect DIY Bacon!","o":"EASY Homemade BACON, Step by Step to Perfect DIY Bacon!","c":"Guga Foods","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=4I0sjituOzM","th":"https://i.ytimg.com/vi/4I0sjituOzM/mqdefault.jpg","i":["1/2 Cup Brown Sugar","1/2 Cup Sea Salt","1/2 Cup Maple Syrup","1/2 Cup Punzo Sauce","1/4 tsp Pink Salt"],"p":["Brine pork belly for 5-7 days.","After, wash it well and remove brine and salt before smoking it.","Smoke until you reach internal core temp of 155°F / 68°C."],"src":"video description"},{"id":"yt-5Wge0usjr_U","s":"y","t":"BONE MARROW Compound Butter, Raise your STEAK GAME!","o":"BONE MARROW Compound Butter, Raise your STEAK GAME!","c":"Guga Foods","cat":"Condiments","st":"full","u":"https://www.youtube.com/watch?v=5Wge0usjr_U","th":"https://i.ytimg.com/vi/5Wge0usjr_U/mqdefault.jpg","i":["8 tbsp Salted Butter (1 stick)","2 tbsp Crispy Bacon","1 tbsp Parsley","3 tbsp Smoked Bone Marrow","## Also used","Bone marrow bones","Salt and water (for soaking)","Hickory wood pellets or chips (for smoking)","Center-cut bacon","Garlic","## Steak","Ribeye steaks","Salt, pepper and garlic powder"],"p":["Soak the bone marrow overnight in salted water in the fridge to draw out the blood.","Smoke the marrow bones for about 2 1/2 hours (foil pouch of hickory pellets in a lidded pan, a smoke gun refreshed every 30 minutes, or a cold smoker on the grill).","Cook center-cut bacon slowly on low heat until very crispy; drain well and blitz into fine bits.","Scoop out the smoked marrow.","Blend garlic, bacon bits, marrow, the stick of salted butter and parsley to a fine paste with a hand blender.","Roll tightly in cling film and refrigerate to firm up.","Season the steaks with salt, pepper and garlic powder and dry brine at leas w8/mqdefault.jpg","i":["14 oz cool tap water","1 1/2 teaspoons salt","1/4 teaspoon instant yeast","3 1/2 cups bread flour"],"p":["Stir the water, salt and yeast together in a bowl.","Add the bread flour and stir until hydrated and combined; scrape the sides.","Cover with plastic wrap and proof 8-24 hours (overnight on the counter).","Spray two bread pans (the top pan on its two sides only).","De-gas the dough with pull and stretch, dust with flour and roll-coat it, then roll it into one pan.","Cover with the second pan upside down and clip with binder clips (\"poor man's Dutch oven\"). Proof 30-60 minutes while the oven heats to 400°F.","Bake 40 minutes covered, then remove the top pan and bake 5-10 minutes more to finish the crust."],"src":"captions (auto-subtitles)"},{"id":"yt-m9oROt8Aalc","s":"y","t":"AWESOME Apple Pie Moonshine Recipe in 3min - GREAT Christmas Gift","o":"AWESOME Apple Pie Moonshine Recipe in 3min  - GREAT Christmas Gift","c":"Jeremy Siers","cat":"Drinks","st":"partial","u":"https://www.youtube.com/watch?v=m9oROt8Aalc","th":"https://i.ytimg.com/vi/m9oROt8Aalc/mqdefault.jpg","i":["1 gallon Apple Juice","1 gallon Apple Cider","2 (1.75L) Bottles Grain Alcohol (153-190 proof)","1 (.75L) Bottle Whipped Cream Vodka","2 Cups white Sugar","2 Cups Brown Sugar","8 Cinnamon Sticks","2 Apples"],"src":"video description","sv":"About 12 jars"},{"id":"yt-FYuuGjVLIBQ","s":"y","t":"Best CHICKEN DRUMSTICK RECIPE I ever made, PERIOD!","o":"Best CHICKEN DRUMSTICK RECIPE I ever made, PERIOD!","c":"Guga Foods","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=FYuuGjVLIBQ","th":"https://i.ytimg.com/vi/FYuuGjVLIBQ/mqdefault.jpg","i":["## Dough","4 cups Chicken Broth","1 Table Cream","1 Stick of Butter (8 tbsp)","Salt n Papper to Taste","All Purpose Flower","2 Egg Yolks","Finish with Chives to Taste","## Filling","Brazilian cream cheese"],"src":"video description"},{"id":"yt-_WM4FSllNjM","s":"y","t":"Recipe: Cajun Butter Steak Bites – Savoury, Cajun-Spiced Skillet Favourite","o":"Recipe: Cajun Butter Steak Bites – Savoury, Cajun-Spiced Skillet Favourite","c":"Cafe Delites","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=_WM4FSllNjM","th":"https://i.ytimg.com/vi/_WM4FSllNjM/mqdefault.jpg","i":["1 tablespoon mild paprika","1 1/2 teaspoons salt","1 1/2 teaspoons garlic powder","1 teaspoon onion powder","1 teaspoon chili powder (add more if you like heat)","3/4 teaspoon dried thyme","1/2 teaspoon dried oregano","1/2 teaspoon brown sugar (keto: use brown sugar substitute)","1/2-3/4 teaspoon cayenne pepper (add more if you like heat)","1/4 teaspoon cracked pepper (to taste)","23 oz steak (, cut into 2-inch cubes, Sirloin, Rump, New York Strip, Porterhouse or Ribeye)","1-2 tablespoons canola oil (divided)","1/4 cup butter","4 cloves garlic (finely chopped)"],"p":["Combine cajun seasoning in a shallow bowl. Add the steak bites and toss to evenly coat.","Heat 2 teaspoons oil in a skillet or pan over medium-high heat until hot.","Sear the steak bites in batches for 2-3 minutes each side until edges are crispy and browned, adding extra oil as needed. Set aside.","Reduce heat to medium. Add butter to the skillet and heat until melted. Sauté the chopped garlic until fragrant (about 30 seconds), while scraping up any browned bits from the pan.","Take the pan off the heat. Throw the steak bites back in and toss through the garlic butter to evenly coat.","Serve warm."],"src":"linked recipe page","su":"https://cafedelites.com/cajun-butter-steak-bites/","sv":"4 people"},{"id":"yt-G4U09p-TE04","s":"y","t":"I made this lost CHEESEBURGER recipe and it blew my mind!","o":"I made this lost CHEESEBURGER recipe and it blew my mind!","c":"Guga Foods","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=G4U09p-TE04","th":"https://i.ytimg.com/vi/G4U09p-TE04/mqdefault.jpg","i":["## Grease mix (custom \"100 yrs oil\")","30% Beef Tallow","20% Pork Fat","10% Duck Fat","40% Canola Oil","1 Worcestershire Sauce","5 White Sweet Onions"],"src":"video description"},{"id":"yt-yE2op6Y0OTU","s":"y","t":"NUT-FREE VEGAN CHEESE SAUCE | 1 sauce, 3 recipes","o":"NUT-FREE VEGAN CHEESE SAUCE | 1 sauce, 3 recipes","c":"Rainbow Plant Life","cat":"Sauces","st":"full","u":"https://www.youtube.com/watch?v=yE2op6Y0OTU","th":"https://i.ytimg.com/vi/yE2op6Y0OTU/mqdefault.jpg","i":["## Nut-free vegan cheese sauce","4 heaped cups cauliflower florets (about 1 medium head, ~400g)","4 cups (~500g) butternut squash, in 3/4-inch pieces","32 oz (~945 mL) water (stovetop method only)","32 oz (~945 mL) vegetable broth","1/4 cup (60 mL) water (or 1 tbsp olive/avocado oil)","10 cloves garlic, minced","1/2 cup nutritional yeast","3/4 cup (~195 mL) canned full-fat coconut milk","1 tsp hot or sweet paprika","Pinch of cayenne (optional)","1 1/2 tsp kosher salt","Black pepper to taste","## Tex-Mex tempeh quesadillas (from the description)","1 TBSP oil","1 8-ounce block tempeh","1 small onion, thinly sliced","4 cloves garlic, minced","1 jalapeno pepper, diced (remove seeds if sensitive to spicy food)","14-16 ounces mushrooms, sliced","2 tsps chili powder","1 tsp ground cumin","½ tsp dried oregano","½ tsp paprika","½ tsp kosher salt + more to taste","3 TBSP tomato paste","1 TBSP lime juice","2-3 tbsp water, as needed","1 - 1½ cups Nut-Free Vegan Cheese Sauce","8 extra large tortillas"],"p":["## Cheese sauce (stovetop)","Bring the water and broth to a boil in a large deep skillet or Dutch oven.","Add the cauliflower and squash, cover and cook 8-10 minutes until fork-tender.","Transfer the vegetables to a blender; reserve 1 1/2 cups cooking liquid and add 1 1/4 cups to the blender.","Simmer the garlic in the 1/4 cup water (or oil) for 3 minutes until fragrant; add to the blender.","Add nutritional yeast, coconut milk, paprika, salt and pepper; blend until smooth, thinning with the reserved liquid. (An Instant Pot method is on the linked page.)","## Creamy cheesy pasta","Cook pasta of your choice in salted boiling water until al dente; drain, add as much cheese sauce as you like, toss and heat through.","## Tex-Mex tempeh quesadillas","Grate the tempeh using a box grater.","Heat a large deep skillet over medium heat with the oil. Once hot, add the onions and cook for 3-4 minutes until starting to soften. Add the garlic and jalapeno and cook for 1-2 minutes, until fragrant.","Add the grated tempeh, mushrooms, and the Tex-Mex spices (chili powder, cumin, oregano, paprika), and cook for 4-6 minutes, stirring often. Add the salt during the last minute of cooking. Add a bit of water as needed, to prevent burning or sticking.","Stir in the tomato paste and lime juice and stir to combine well. Cook for another 3-5 minutes. If the mixture starts to dry out, add 2-3 TBSP water as needed.","Remove the filling from the skillet and set aside in a bowl.  Wipe down the skillet and return it to medium heat.","Spread one tortilla with several tablespoons of the Nut-Free Vegan Cheese Sauce. Spoon 1/4 of the tempeh-mushroom filling on top. Drizzle a few more spoons of the cheese sauce on top of that. Top with a second tortilla.","Add the quesadilla to the large skillet over medium heat. Place a smaller skillet on top of the quesadilla so that it presses down on the quesadilla. Cook the quesadilla for 3 minutes, then flip and cook another 1-2 minutes, or until both sides are crispy and nicely browned. Repeat with the remaining sauce, filling, and tortillas."],"src":"linked recipe page (Rainbow Plant Life) + video description (quesadilla and pasta recipes)","su":"https://rainbowplantlife.com/nut-free-vegan-cheese-sauce/","sv":"12 (6 cups)"},{"id":"yt-IVGorN_2lvk","s":"y","t":"How to Cook Creamy Pepper Sauce for a Scotch Fillet Steak (Sauce au Poivre)","o":"How to Cook Creamy Pepper Sauce for a Scotch Fillet Steak (Sauce au Poivre)","c":"We Like Food","cat":"Sauces","st":"partial","u":"https://www.youtube.com/watch?v=IVGorN_2lvk","th":"https://i.ytimg.com/vi/IVGorN_2lvk/mqdefault.jpg","i":["1 shallot, finely diced","2 cloves garlic","Steak of choice (Scotch fillet), seasoned with salt and pepper","Canola oil","Butter","1/2 cup white wine","1 tablespoon freshly ground black pepper","1/2 cup thickened cream"],"p":["Sear the seasoned steak in a very hot pan with canola oil, about 3 minutes per side for medium-rare; rest under foil.","Deglaze the pan with white wine; add the shallots and garlic and cook until soft and browning.","Add butter and cook one more minute.","Add 1/2 cup white wine and 1 tablespoon cracked black pepper; reduce by half.","Add 1/2 cup thickened cream, simmer and reduce until it coats the back of a spoon; stir in the steak resting juices."],"src":"captions (auto-subtitles)"},{"id":"yt-bSOd8r4wjec","s":"y","t":"Salmon with Garlic Butter Sauce | SAM THE COOKING GUY","o":"Salmon with Garlic Butter Sauce | SAM THE COOKING GUY","c":"SAM THE COOKING GUY","cat":"Seafood","st":"full","u":"https://www.youtube.com/watch?v=bSOd8r4wjec","th":"https://i.ytimg.com/vi/bSOd8r4wjec/mqdefault.jpg","i":["Salmon fillet (room temperature)","Oil","Salt and pepper","## Sauce","A couple tablespoons diced red onion (or shallot)","Garlic","1/2 cup vermouth (or white wine)","2 tablespoons cold butter","About 1/4 cup heavy cream","Juice of 1 lemon","1 big tablespoon chopped dill","Salt and pepper"],"p":["Sweat the red onion and garlic in a little oil in a small pan for 3-4 minutes.","Oil and season the salmon on both sides.","Add the vermouth to the sauce and reduce by about 30%.","Melt in the cold butter, then add the cream and let it bubble.","Sear the salmon presentation-side down in a hot pan; cook about a third of the way up, then flip.","Add the lemon juice and dill to the sauce; season with salt and pepper.","Rest the fish briefly and spoon the sauce over."],"src":"captions (auto-subtitles)"},{"id":"yt-57pDaaEGAR8","s":"y","t":"Brisket Smoked On The Weber Kettle","o":"Brisket Smoked On The Weber Kettle","c":"Cooking With Ry","cat":"Meats","st":"partial","u":"https://www
