.com/vi/kyUPvM0M5BE/mqdefault.jpg","i":["450 g Garnelen, geschält und entdarmt","1 EL Olivenöl","1 Schalotte","200 g Nudeln","2 EL Butter","1 Knoblauchzehe","80 ml (1/3 Tasse) Weißwein (Wein durch Saft von 1/2 Zitrone ersetzen)","470 ml (2 Tassen) schwere Schlagsahne","70 g Parmesankäse","Mit Salz und schwarzem Pfeffer würzen","Paprika bestreuen","Nach Belieben Petersilie zum Garnieren","1 TL Salz"],"src":"video description (German)"},{"id":"yt-ob6uMsIc7Qs","s":"y","t":"How I made a 1930's recipe BETTER!","o":"How I made a 1930's recipe BETTER!","c":"Guga Foods","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=ob6uMsIc7Qs","th":"https://i.ytimg.com/vi/ob6uMsIc7Qs/mqdefault.jpg","i":["2 6-8oz Steaks of choice","1  tbsp avocado oil","1 1/2 tbsp unsalted butter","4 medium shallots","3-5 cloves of garlic","1 1/2 cups mushrooms or choice","6 sprigs of fresh thyme","2 tbsp chopped parsley","1 tbsp thinly sliced chives","1 tbsp Worcestershire sauce","3 tbsp cognac or brandy","2 tsp Dijon mustard","2 cups beef stock","2 1/2 tbsp unsalted butter"],"src":"video description"},{"id":"yt-wB8MzBtsOmc","s":"y","t":"The BEST Gravy Recipe so tasty you'll be running to UR-MAMI","o":"The BEST Gravy Recipe so tasty you'll be running to UR-MAMI","c":"Yeung Man Cooking","cat":"Sauces","st":"full","u":"https://www.youtube.com/watch?v=wB8MzBtsOmc","th":"https://i.ytimg.com/vi/wB8MzBtsOmc/mqdefault.jpg","i":["2 pieces garlic","1/2 onion","1 tbsp + splash avocado oil","pepper to taste","1-2 small pre-boiled potatoes","7g dried mushrooms","1/2 cup red wine","1/4 tsp cayenne pepper","1/4 tsp cumin","1 tsp smoked paprika","1 tbsp soy sauce","1/2 tbsp dark soy sauce","1 cup veggie stock","1/2lb shiitake mushrooms","pinch of salt"],"p":["Roughly chop the garlic and slice the onion","Heat up a sauté pan to medium heat.  Add 1 tbsp avocado oil followed by the onions, garlic, and pepper to taste.  Sauté for about 5-6min","Add 1-2 small pre-boiled potatoes and dried mushrooms.  Add the red wine, deglaze, and simmer for about 1min.  Then, add the cayenne pepper, cumin, smoked paprika, soy sauce, dark soy sauce, and veggie stock.  Stir and cook for 5-6min","Transfer the mixture to a blender and blend on high until completely liquified.  You can adjust the thickness of the gravy to your personal preference by adding a little more veggie stock or potato","Slice the shiitake mushrooms","Heat up a nonstick pan to medium heat.  Dry sauté the mushrooms for 4-5min.  Add a pinch of salt and fresh cracked pepper to taste","Add a splash of avocado oil and sauté for another couple of minutes","Heat up the gravy with the mushrooms in the sauté pan"],"src":"video description"},{"id":"yt-1Mkgb8Fxr_o","s":"y","t":"Super Delicious Pineapple Fried Rice Recipe to make ON REPEAT!","o":"Super Delicious Pineapple Fried Rice Recipe to make ON REPEAT!","c":"Yeung Man Cooking","cat":"Vegetarian Mains","st":"full","u":"https://www.youtube.com/watch?v=1Mkgb8Fxr_o","th":"https://i.ytimg.com/vi/1Mkgb8Fxr_o/mqdefault.jpg","i":["1 ripe pineapple","75g extra firm tofu","1/2 red onion","2 pieces garlic","small piece ginger","1/4 cup peanuts","3 tbsp chili oil (","1 cup cooked rice","2 tsp curry powder","1/2 tbsp soy sauce","1 tsp dark soy sauce","1/2 tsp toasted sesame oil","1/4 cayenne pepper","few sprigs cilantro"],"p":["Slice the ripe pineapple in half and scoop out the inside meat, leaving the shell intact to use as the final serving bowl","Remove the pineapple core (use in smoothies!) and chop the meat into bite sized pieces preserving as much juice as possible","Broil the pineapple bowls in the oven for 3-4mins (bowl side up)","Chop the extra firm tofu into small cubes.  Finely chop the red onion, garlic, and ginger","Heat up a nonstick pan to medium heat.  Add the peanuts and toast for 2-3mins, then set aside","Heat the pan back to medium heat and add the chili oil followed by the red onions.  Sauté for 3-4mins","Add the garlic, ginger, and tofu.  Sauté for 2-3mins.  Then, add the cooked rice, pineapple pieces, curry powder, soy sauce, dark soy sauce, toasted sesame oil, about 2 tbsp of juice from the pineapple, and cayenne pepper.  Sauté for another 3-4mins","Add the toasted peanuts and give the pan a good mix.  Plate the fried rice in the pineapple bowls and garnish with freshly chopped cilantro to serve"],"src":"video description"},{"id":"yt-SXc64GOgPqw","s":"y","t":"Vegetarian Mushroom Melt Burger Recipe that WON'T FALL APART!","o":"Vegetarian Mushroom Melt Burger Recipe that WON'T FALL APART!","c":"Yeung Man Cooking","cat":"Vegetarian Mains","st":"full","u":"https://www.youtube.com/watch?v=SXc64GOgPqw","th":"https://i.ytimg.com/vi/SXc64GOgPqw/mqdefault.jpg","i":["2 cups rolled oats (can use GF also)","100g cremini mushrooms","1/2 red onion","1 cup canned black beans","1/4 cup corn","1/2 green bell pepper","1 large cooked beet","1 tsp salt","1 tsp garlic powder","1 tsp onion powder","1 tsp cumin","1 tbsp smoked paprika","pepper to taste","drizzle of olive oil","200g fresh shiitake","2 burger buns","2 slices your favourite plantbased cheese","chickpea mayo to taste (","wasabi to taste","few leaves romaine lettuce","few slices red onion"],"p":["Blend up the rolled oats in the food processor for a few seconds","Add the cremini mushrooms to the food processor.  Roughly chop the red onion and add to the food processor along with the black beans, corn, green bell pepper, and the beet","Add the salt, garlic/onion powders, cumin, smoked paprika, some pepper, and a drizzle of olive oil to the food processor.  Blend for about 45 seconds","Transfer the mixture to a mixing bowl.  Then, cut a sheet of parchment paper into 6 squares that are about 4x4 inches each","Rub your hands with a little bit of olive oil.  Then, scoop about a 1/2 cup worth of burger mixture to shape with your hands (try not to keep the mixture on your hands for too long).  Place the burger patty onto one of the pieces of parchment paper.  Repeat until you're out of mixture (should have 6 patties)","Refrigerate the patties for 15-20min before cooking to firm them up","In the meantime, thinly slice the shiitake mushrooms","Heat up a nonstick pan to medium heat.  Toast the burger buns for about 30sec on each side.  Then, set them aside","Drizzle some olive oil into the pan.  Then, sauté the shiitake mushrooms for 4-5min.  Season the mushrooms with salt and pepper","Set the mushrooms aside once they are nice and crispy","Add another small drizzle of olive oil into the pan.  Add two of the burger patties and cook for 3min","Carefully flip the burger patties.  Then, place a slice of cheese on each patty and some of the shiitake mushrooms on top","Cover the pan with a lid and melt the cheese for about 1min","Combine the mayo and wasabi together","Assemble the burger by spreading some of the wasabi mayo on the bottom bun.  Then, add some romaine lettuce leaves followed by the mushroom melt beet burger and some thinly sliced red onions"],"src":"video description"},{"id":"yt-cHkAZanRcxs","s":"y","t":"This amazingly creamy Chili Oil Spaghetti Recipe is a weeknight PASTA-BILITY","o":"This amazingly creamy Chili Oil Spaghetti Recipe is a weeknight PASTA-BILITY","c":"Yeung Man Cooking","cat":"Pasta","st":"full","u":"https://www.youtube.com/watch?v=cHkAZanRcxs","th":"https://i.ytimg.com/vi/cHkAZanRcxs/mqdefault.jpg","i":["6-7 pieces garlic","1 onion","2 + 1 tbsp chili oil (","2 tsp salt","1 1/2 cups raw cashews","2 1/2 cups water","100g chanterelles","pepper to taste","1/4lb spaghetti","few leaves of basil"],"p":["Roughly chop the garlic and finely chop the onion","Be sure to take the time to brush off the dirt from the chanterelles.  Heat up a sauté pan to medium heat.  Add 2 tbsp of chili oil followed by the onions and garlic.  Sauté for 6-7min","Add the salt and raw cashews.  Sauté for a few minutes.  Add the water, stir, and cook for another couple of minutes","Carefully transfer the mixture to a blender.  Then, blend on high until liquified.  Pour the creamy sauce into a jar and let it cool.  Set aside about 1 cup and keep the rest in the fridge.  Enjoy for up to 2 weeks","Bring a pot of water to boil for the noodles","Bring the sauté pan back to medium heat and add the chanterelles.  Dry sauté for 4-5min.  Add 1 tbsp chili oil, a pinch of salt, and pepper to taste.  Sauté for about 2min and set aside (you can heat the mushrooms in the oven before plating)","Boil the pasta for 1min less to package instructions and stir the noodles occasionally","About a minute before the pasta is done, heat the sauté pan back to medium heat.  Deglaze the pan with about a 1/3 cup of pasta water.  Carefully transfer the spaghetti to the sauté pan","Add about 1 cup of the cream sauce.  Give the pasta good stir, then turn the heat off (you can add a bit of water if the sauce looks too thick)","Plate the spaghetti and top with a few leaves of basil, pepper to taste, and the sautéed chanterelles"],"src":"video description"},{"id":"yt-C-5g4qfKSoY","s":"y","t":"THICK vegan Mayo Recipe made from CHICKPEAS (aquafaba)!","o":"THICK vegan Mayo Recipe made from CHICKPEAS (aquafaba)!","c":"Yeung Man Cooking","cat":"Condiments","st":"full","u":"https://www.youtube.com/watch?v=C-5g4qfKSoY","th":"https://i.ytimg.com/vi/C-5g4qfKSoY/mqdefault.jpg","i":["400ml can of chickpeas (roughly 3/4 cups aquafaba)","1 tbsp lemon juice","1 tbsp canned chickpeas","1 tbsp dijon mustard","1 3/4 cups of grapeseed or vegetable oil (drizzle in a little more for an even thicker mayo)","generous pinch pink salt","(Optional Spicy Mayo) Add 1 part gochujang to 2 parts mayo"],"p":["Empty the can of chickpea water (aquafaba) into a small saucepan","Boil the aquafaba on medium high heat for 5-6min stirring often","Add some ice to a large mixing bowl, then place a smaller bowl on top of the ice","Pour in the chickpea water and stir until cold","Add the lemon juice and 1 tbsp of chickpeas","Transfer the mixture to the blender and add the dijon mustard","Blend on the highest setting to pulverize the chickpeas.  Then, turn it down to medium to medium high","Slowly pour in the oil.  The mayo will start to thicken up (adjust and pulse the speed if needed)","Transfer the mayo to a mixing bowl and add a generous pinch of pink salt.  Fold to combine"],"src":"video description"},{"id":"yt-5ZXnXT3SQ78","s":"y","t":"Quick Garlic Turmeric Rice Recipe for DINNER TONIGHT?","o":"Quick Garlic Turmeric Rice Recipe for DINNER TONIGHT?","c":"Yeung Man Cooking","cat":"Sides","st":"full","u":"https://www.youtube.com/watch?v=5ZXnXT3SQ78","th":"https://i.ytimg.com/vi/5ZXnXT3SQ78/mqdefault.jpg","i":["6-7 pieces of garlic","1/2 onion","80g broccolini","1/4 red bell pepper","3 tbsp avocado oil","pinch crushed pepper flakes","1/4 cup corn","1 1/2 cups basmati rice (cooked)","1 tsp turmeric","pinch of salt"],"p":["Finely chop the garlic, onion, broccolini, and red bell pepper","Heat up a nonstick pan to medium low heat.  Add 2 tbsp of avocado oil","Cook the garlic and onions for 6-7min.  Add the crushed pepper flakes","Set the garlic and onions aside.  Heat the pan to medium heat and add 1 tbsp of avocado oil","Sauté the broccolini and red bell pepper for a couple of minutes.  Add the corn, basmati rice, turmeric, salt, and the cooked garlic and onions.  Sauté for 2-3min","Plate and sprinkle with some more crushed pepper flakes"],"src":"video description"},{"id":"yt-3RA4DghJ1MM","s":"y","t":"One of my FAVOURITE recipes of all time!","o":"One of my FAVOURITE recipes of all time!","c":"Kitchen Sanctuary","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=3RA4DghJ1MM","th":"https://i.ytimg.com/vi/3RA4DghJ1MM/mqdefault.jpg","i":["Slow-Cooked Pork Belly","2.2 lb (1Kg) rindless pork belly slices chopped in half (each piece being approx. the length of your index finger)","4 1/4 cups (1 Litre) hot chicken/veg stock","1 thumb sized piece of ginger peeled and finely chopped (or 1 tbsp of minced ginger)","3 cloves garlic peeled and chopped in half","1 tbsp. rice wine","1 tbsp. caster sugar","Glaze","2 tbsp vegetable oil","pinch of salt and pepper","1 thumb-sized piece of ginger peeled and minced","1 red chilli finely chopped","2 tbsp Honey","2 tbsp brown sugar","3 tbsp dark soy sauce","1 tsp lemon grass paste","To Serve","Boiled rice","Green Vegetables"],"p":["Add all the slow-cooked pork belly ingredients to a pan (not the glaze ingredients) I use a cast iron casserole pan.","Bring to the boil, then place a lid on, turn down the heat and simmer for 2 hours.","Turn off the heat and drain the pork. You can reserve the liquid if you like (Perfect for a Thai or Chinese noodle soup).","Chop the pork into bite sized chunks. Add 1 tbsp. of the oil to a frying pan, and then mix the remaining glaze ingredients in a small bowl.","Heat the oil and add in the pork, salt and pepper, frying on a high heat until the pork starts to turn golden.","Now pour the glaze over the pork and continue to cook until the pork looks dark and sticky.","Remove from the heat and serve."],"src":"video description","sv":"4-6"},{"id":"yt-mmgi1Q5Oiow","s":"y","t":"Shut the front door + all the windows for this CRISPY Tofu Katsu Burger Recipe!","o":"Shut the front door + all the windows for this CRISPY Tofu Katsu Burger Recipe!","c":"Yeung Man Cooking","cat":"Vegetarian Mains","st":"full","u":"https://www.youtube.com/watch?v=mmgi1Q5Oiow","th":"https://i.ytimg.com/vi/mmgi1Q5Oiow/mqdefault.jpg","i":["140g extra firm tofu","40g purple cabbage","20g carrot","1/2 apple (fuji)","1/2 stick green onion","2 tbsp mayo (","pinch of salt","tbsp sriracha","1/2 cup flour","1 1/2 tbsp soy sauce","splash of water","1/2 cup panko","2 burger buns","1 cup avocado oil","5g leafy greens","1 tsp white sesame seeds"],"p":["Slice the extra firm tofu block into thick patties","Thinly slice the purple cabbage.  Slice the carrot and apple into thin matchsticks.  Finely chop the green onion","Place the veggies into a bowl and mix together with the mayo, a pinch of salt, and sriracha.  Set the slaw aside","Add the flour, soy sauce, and water to a small bowl.  Whisk until it becomes a fairly thick consistency","Pour the panko into another small bowl","Dunk the tofu into the sticky flour mixture.  Then, transfer the tofu to the panko and coat","Slice the burger buns in half and toast them in a dry frying pan on medium heat for about 1min on each side.  Then, transfer them to a cooling rack","Add the avocado oil into the frying pan.  Let the oil heat up for a few minutes.  Stick in a bamboo chopstick - the oil is ready when there are fast moving bubbles","Carefully place in and fry the breaded tofu for about 2-3min on each side.  Rest the tofu on a plate lined with paper towel","Assemble the burger by placing some leafy greens on the bottom bun.  Then, add the tofu katsu followed by a generous scoop of the crunchy slaw.  Sprinkle with some toasted sesame seeds and serve"],"src":"video description"},{"id":"yt-YFe_uwCpWP0","s":"y","t":"Red Wine Braised Short Ribs Recipe [click arrow to the right (on iPad) or scroll to see In","o":"Red Wine Braised Short Ribs Recipe [click arrow to the right (on iPad) or scroll to see Ingredients]","c":"Homecooking With Chef Walter","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=YFe_uwCpWP0","th":"https://i.ytimg.com/vi/YFe_uwCpWP0/mqdefault.jpg","i":["2 pounds bone-in Short ribs, about 4 inches each in length","Light Olive Oil or Vegetable Oil","2 Tbsp Unsalted Butter","2 Onions","2 Medium Carrots","2 Celery Ribs","Bouquet Garni (one sprig each: Rosemary, Thyme, Parsley, 1 Bay Leaf) tied or wrapped in Leek leaf or cheesecloth","2 Tbsp Tomato Paste","1 Bottle Dry Red Wine (Zinfandel, Cabernet Sauvignon)","1 14oz Can Chopped Tomatoes","Opt.: 1/2 cup Dried Shitake Mushrooms, re-hydrated, or","1/2 cup Fresh Wild Mushrooms","Beef or Chicken Stock, or Water to Cover","Salt and Pepper to taste","As a finishing touch, make a garnish of grated lemon zest, finely minced parsley and garlic (Gremolata). and drizzle over top of ribs.","## Polenta","200g Polenta","200ml Milk","800ml Water","125g Unsalted Butter","75g Grated Cheese (Parm/Mozz/Emmental","Nutmeg to grate","1 Spring Thyme (leaves only)","Salt/Pepper to taste"],"p":["## Polenta","In large saucepan, bring Water and Milk to boil. Stir in 1 teaspoon Salt, then “rain” in Polenta grains, whisking continually for 2-3 minutes over high heat.","Reduce heat to very low, cover and cook for 30-35 minutes, stirring every 5 minutes with wooden spoon.","When Polenta pulls away from side of pan, remove from heat, stir in half the butter (in pieces), grate in Nutmeg, add the Thyme leaves.","Cover and let rest for 5 minutes, then stirr in rest of the butter and the cheese. Adjust seasoning, then serve."],"n":["Rib method is shown in the video only; the description gives the full polenta method."],"src":"video description"},{"id":"yt-vkcHmpKxFwg","s":"y","t":"The Best Pancakes You'll Ever Make | Epicurious 101","o":"The Best Pancakes You'll Ever Make | Epicurious 101","c":"Epicurious","cat":"Eggs & Breakfast","st":"partial","u":"https://www.youtube.com/watch?v=vkcHmpKxFwg","th":"https://i.ytimg.com/vi/vkcHmpKxFwg/mqdefault.jpg","i":["## Dry","All-purpose flour","Sugar","Salt","Baking powder","Baking soda","## Wet","Milk","Vegetable (neutral) oil","Vanilla","Apple cider vinegar","Eggs","## To cook and serve","Whipped salted butter","Maple syrup (grade A amber)"],"p":["Whisk the dry ingredients together.","Whisk the milk, oil, vanilla, cider vinegar (milk + vinegar = quick buttermilk) and eggs until well combined.","Fold wet into dry only 20-25 strokes; leave lumps and don't mix again. Keep the batter thick.","Heat a griddle with a generous dollop of whipped salted butter.","Scoop batter from the side of the bowl without stirring; don't worry about perfect circles.","Flip once bubbles pop through and the edges are set, flipping away from you; never press down.","Done when they spring back. Serve with whipped salted butter between layers and maple syrup."],"src":"captions (auto-subtitles) (no quantities given in video or description)"},{"id":"yt-YHQf0BwfiCg","s":"y","t":"ANYONE can make this easy and MESME-RICING Saffron Risotto recipe","o":"ANYONE can make this easy and MESME-RICING Saffron Risotto recipe","c":"Yeung Man Cooking","cat":"Vegetarian Mains","st":"full","u":"https://www.youtube.com/watch?v=YHQf0BwfiCg","th":"https://i.ytimg.com/vi/YHQf0BwfiCg/mqdefault.jpg","i":["2 1/2 cups vegetable stock","1 onion","2 pieces garlic","50g oyster mushrooms","cluster of 3 cherry tomatoes","2+2 tbsp olive oil","salt and pepper to taste","1/2 cup arborio rice","pinch of saffron","1/4 cup white wine","1/4 cup plantbased cheese","few sprigs parsley"],"p":["Heat up the vegetable stock in a small saucepan on medium high heat","Finely chop the onion and garlic.  Roughly chop the oyster mushrooms.  Place the cluster of tomatoes onto a baking sheet","Heat up a sauté pan to medium heat.  Add 2 tbsp olive oil followed by the mushrooms.  Sauté for a few minutes.  Season with salt and pepper.  Then, sauté for another minute","Transfer the sautéed mushrooms onto the baking sheet and spread it out.  Slightly score the cherry tomatoes","Add 2 tbsp olive oil to the sauté pan.  Add the onions and sauté for 3-4min.  Add the garlic and sauté for another minute","Add the arborio rice and sauté for 2-3min.  Season with salt and pepper.  Then, add a pinch of saffron","Give the pan a stir and deglaze with white wine.  Stir and cook for a couple of minutes","Add about 1/2 cup of the hot vegetable stock.  Stir and cook for a couple of minutes.  As the rice cooks, you'll see the liquid being absorbed.  Repeat this step adding about 1/2 up of vegetable stock at a time","Place the mushrooms and tomatoes into the oven and broil on low for 5-8min (set a timer as to not forget about them)","Add the plantbased cheese and stir.  The risotto should look creamy but not too thick.  Remember to check the rice for doneness","Plate the risotto and top with the broiled mushrooms and blistered tomatoes.  Sprinkle over some freshly chopped parsley, fresh cracked pepper, and a drizzle of olive oil"],"src":"video description"},{"id":"yt-ZE_gzIx8tuQ","s":"y","t":"Pan-Seared Duck Breast with Plum Sauce & Mashed Sweet Potatoes","o":"Pan-Seared Duck Breast with Plum Sauce & Mashed Sweet Potatoes","c":"Tatyana's Everyday Food","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=ZE_gzIx8tuQ","th":"https://i.ytimg.com/vi/ZE_gzIx8tuQ/mqdefault.jpg","i":["4 large duck breasts (skin in)","sea salt","5 to 6 whole garlic cloves","2 sprigs fresh thyme & rosemary","1/2 cup red wine (such as cabernet or zinfandel)","1/2 cup plum preserves","1 to 3 tbsp balsamic vinegar","2 to 3 tbsp duck fat (from the pan)"],"p":["To get the best results, this duck recipe requires a little bit of prep work. I get my duck breast frozen from Whole Foods and allow it to thaw in the refrigerator first. Once the duck has thawed, I take a paper towel, pat it dry, then set it into a tray uncovered. You want the duck breast skin to be nice and dry.","When you’re ready to prepare the duck, use a very sharp knife to score the skin evenly, creating a small diamond pattern. Do this carefully so you’re only slicing the skin and not the duck meat!","Once the skin is scored, season the duck breast generously on both sides with sea salt.","Start with a large, stainless-steel frying pan (cast-iron will also work). The pan needs to be cold!","Place the duck breast skin side down in the pan, then turn the stove on to a medium heat. Fry the duck breast for 10 to 15 minutes, slowly, until the skin is golden and extra crispy. Don’t turn it until it’s golden!","Once the fat is rendered and skin is crispy, turn the duck breast over. Add the garlic, thyme, and rosemary into the pan.","Continue to brown the duck breast on the bottom and sides, basting with the duck fat in the pan, until it’s nicely browned. Once browned all over, place the skin side down again and continue to cook.","Use a digital thermometer to check the temperature. Cook for 130F/54C for a medium doneness. Overcooking the duck will make it less tender.","Remove the duck from the pan and onto a tray or cutting board to rest. Rest the meat for at least 8 to 10 minutes. I like to keep the tray on the stovetop so the meat doesn’t get cold.","While your duck is resting, it’s time to prepare the simple plum sauce to go with the duck.","Pour the wine into a small saucepan and bring it to a simmer over medium heat. Allow the red wine to reduce for about 5 minutes. This will burn off some of the alcohol.","Add in the plum sauce and balsamic vinegar next. Adjust the vinegar to taste and add more if the sauce is too sweet. Add in a few tablespoons of the rendered duck fat from the pan.","Whisk everything together and simmer the sauce, stirring occasionally, for 5 to 7 minutes until it’s nicely thickened. Keep it covered until ready to serve.","Once the duck breast has rested, use a sharp knife to slice the meat into thin slices. Plate the duck breast with a side of mashed sweet potatoes and spoon the plum sauce over the top. Add a touch of ground black pepper on top, if desired, and enjoy!","Nutritional info calculated for duck breast with plum sauce. Sauce has approximately 50 calories per tablespoon."],"src":"linked recipe page","su":"https://tatyanaseverydayfood.com/duck-breast-w-plum-sauce/","sv":"4 servings"},{"id":"yt-9d3aAjlji9Y","s":"y","t":"Bacon Butter Sauce LIKE A CHEF","o":"Bacon Butter Sauce LIKE A CHEF","c":"Fallow","cat":"Sauces","st":"partial","u":"https://www.youtube.com/watch?v=9d3aAjlji9Y","th":"https://i.ytimg.com/vi/9d3aAjlji9Y/mqdefault.jpg","i":["Oil","Sliced smoked bacon","Onions","Carrots","Mushrooms","Garlic","White wine","Paprika","Tomato paste","Thyme","Black peppercorns","Water","Cold butter","Lemon","Vinegar","Whipping cream","Salt"],"p":["Heat a large pan with oil; cook the sliced smoked bacon until golden and foaming.","Add onions, carrots, mushrooms and garlic.","Deglaze with white wine; add paprika, tomato paste, thyme and black peppercorns. Reduce by half.","Add water and simmer for 90 minutes. Pass through a sieve and refrigerate overnight.","Skim the fat off the top (keep it). Reduce the stock again.","Off the heat, use a stick blender to emulsify the bacon fat back in along with cold butter.","Add lemon and vinegar, season to taste, whisk in whipping cream and bring back to the boil; it should coat the back of a spoon.","Serve with pan-fried crispy fish."],"src":"captions (auto-subtitles) (no quantities spoken)"},{"id":"yt-7WmN6tvsKlo","s":"y","t":"Don't cook chicken legs until you see this technique that conquers the world!","o":"Don't cook chicken legs until you see this technique that conquers the world!","c":"Appetizing - Meat Recipes","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=7WmN6tvsKlo","th":"https://i.ytimg.com/vi/7WmN6tvsKlo/mqdefault.jpg","i":["whole chicken legs : 3 pc","sweet paprika: 3 g (0.1 oz)","soy sauce: 20 ml (0.7 fl oz)","mustard seeds: 30 g (1.1 oz)","salt: 3 g (0.1 oz)","black pepper: 3 g (0.1 oz)","water: 100 ml (3.4 fl oz)","potatoes: 8 pc","water: 1 l (34 pt)","butter: 20 g (0.7 oz)","black pepper: 3 g (0.1 oz)","salt: 3 g (0.1 oz)","garlic powder: 3 g (0.1 oz)","milk: 100 ml (3.4 fl oz)","cooking cream: 100 g (3.5 oz)","cheese: 100 g (3.5 oz)","barbeque sauce: 20 g (0.7 oz)","mustard seeds: 20 g (0.7 oz)","chili sauce: 20 g (0.7 oz)","honey: 20 g (0.7 oz)","garlic: 2 cloves","lemon juice: 20 ml (0.7 fl oz)"],"src":"video description"},{"id":"yt-q_YsUkQQW04","s":"y","t":"How to Make Lemon Posset with Berries","o":"How to Make Lemon Posset with Berries","c":"America's Test Kitchen","cat":"Desserts","st":"full","u":"https://www.youtube.com/watch?v=q_YsUkQQW04","th":"https://i.ytimg.com/vi/q_YsUkQQW04/mqdefault.jpg","i":["2 cups heavy cream","2/3 cup (4 2/3 ounces/132 grams) granulated sugar","1 tablespoon grated lemon zest plus 6 tablespoons juice (2 lemons)","1 1/2 cups blueberries or raspberries"],"p":["Combine cream, sugar, and lemon zest in medium saucepan and bring to boil over medium heat. Continue to boil, stirring frequently to dissolve sugar. If mixture begins to boil over, briefly remove from heat. Cook until mixture is reduced to 2 cups, 8 to 12 minutes.","Remove saucepan from heat and stir in lemon juice. Let sit until mixture is cooled slightly and skin forms on top, about 20 minutes. Strain through fine-mesh strainer into bowl; discard zest. Divide mixture evenly among 6 individual ramekins or serving glasses.","Refrigerate, uncovered, until set, at least 3 hours. Once chilled, possets can be wrapped in plastic wrap and refrigerated for up to 2 days. Unwrap and let sit at room temperature for 10 minutes before serving. Garnish with berries and serve."],"src":"linked recipe page","su":"https://www.americastestkitchen.com/recipes/8716-lemon-posset-with-berries","sv":"Serves 6"},{"id":"yt-aOI5pUXSQ4M","s":"y","t":"Red Wine Braised Short Ribs (in-depth guide to braising)","o":"Red Wine Braised Short Ribs (in-depth guide to braising)","c":"Helen Rennie","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=aOI5pUXSQ4M","th":"https://i.ytimg.com/vi/aOI5pUXSQ4M/mqdefault.jpg","i":["5-6 Lb (2.25 - 2.75kg) bone-in beef short ribs","Salt and black pepper","1-2 Tbsp neutral oil (like canola or safflower)","2 sliced carrots","2 sliced yellow onions","4 sliced garlic cloves","2 Tbsp tomato paste","1 bottle (750ml) red wine with moderate tannin and acidity","2 cups unsalted brown chicken of beef stock*","7g (1 packet) powdered gelatin (if using store bought or wimpy stock)","Thyme sprigs","1 bay leaf","2 tsp pomegranate molasses (optional)","1 Tbsp all-purpose flour (either bleached or unbleached)","1 Tbsp unsalted butter at room temperature"],"p":["Trim the silver skin on short ribs.  Put the oil into a large, deep, oven safe skillet or dutch oven and set over high heat.  Dry the short ribs thoroughly with paper towels and season lightly with salt and pepper.  Brown on all sides, adding oil as necessary and regulating the heat so that the short ribs brown steadily, but not too aggressively (do this in batches if necessary).  Remove the short ribs from the pan.  Add the carrots and onions to the pan.  Reduce the heat to medium and cook stirring occasionally until golden brown.  While the vegetables are cooking, preheat the oven to 300F (150C) with a rack in the middle, and sprinkle gelatin over the stock (unless it’s pretty gelatinous already) and let it sit for 5 min.","Add the garlic and tomato paste to the vegetables in the pan and cook stirring constantly until evenly distributed.  Add the short ribs back to the pan bone side down snuggling them in between the veggies.  Pour in the wine, stock, and enough water to almost cover the short ribs.  Add the thyme sprigs and the bay leaf.  Cover with a lid or a round piece of parchment paper.  If using the paper, tuck it in so that it makes full contact with the liquid.  Cook in the middle of the oven until fork tender, 3-5 hours.","Remove from the oven, flip the short ribs bone side up and let cool in the sauce to lukewarm, about 2 hours.  Remove and discard the bones and connective tissue (or save for stock   Put the meat into a container and cool completely.  Strain the sauce through a fine mesh sieve into a container and cool completely.  Refrigerate the meat and the sauce overnight or up to 5 days (only cover once they are completely cool).","The next day, remove the grease from the sauce.  At this point the meat and the sauce can be frozen if desired.  Put the sauce into a large skillet and boil it down until slightly syrupy.  Stir in the pomegranate molasses.  Add the short ribs, cover, and warm up on very low heat flipping occasionally, about 15 minutes.  In a small bowl, mash the flour and butter together with a fork into a smooth paste.  Remove the short ribs from the pan.  Taste the sauce.  If it’s too salty, don’t reduce it anymore.  Add a splash of water, and use the flour butter paste to thicken.  If it’s not salty and still feels too thin, boil it down.  If you feel that it needs help thickening, stir in the flour butter paste a bit at a time, bringing the sauce to a simmer after each addition.  Wait 30-60 seconds after the sauce comes to a simmer before judging the thickness.  Stir constantly.  Taste and correct for salt.  If the sauce ends up too thick or salty, add a splash of water.  Pour over the short ribs and serve."],"src":"video description"},{"id":"yt-Fq5UsaElVUI","s":"y","t":"Beef Wellington Is Overrated, Make This Instead","o":"Beef Wellington Is Overrated, Make This Instead","c":"ThatDudeCanCook","cat":"Meats","st":"partial","u":"https://www.youtube.com/watch?v=Fq5UsaElVUI","th":"https://i.ytimg.com/vi/Fq5UsaElVUI/mqdefault.jpg","i":["## Gorgonzola sauce","1 tbsp unsalted butter","2 medium shallots brunoise","3 cloves garlic finely sliced","5 sprigs of stripped thyme","1/2 cup dry white wine (sub with 2 tsp white wine vinegar or lemon juice)","3 cups heavy cream","2 oz parmigiana reggiano cheese","6 oz gorgonzola cheese","2 tsp Dijon mustard","2 tbsp chopped parsley or chives","Salt and pepper to taste"],"src":"video description"},{"id":"yt-KLT_S0JxeEE","s":"y","t":"Der tollste SANFTE Kuchen für das neue Jahr! Weihnachtskuchen-Rezept ohne Ofen!","o":"🎄🔥 Der tollste SANFTE Kuchen für das neue Jahr! Weihnachtskuchen-Rezept ohne Ofen!","c":"Lieblingsdesserts","cat":"Desserts","st":"full","u":"https://www.youtube.com/watch?v=KLT_S0JxeEE","th":"https://i.ytimg.com/vi/KLT_S0JxeEE/mqdefault.jpg","p":["0:30 Vorbereiten des Kuchenbodens","2 Eier. Eine Prise Salz. 70 g Zucker.","1 Esslöffel Honig.","20 g Butter. 30 ml Milch.","65 g Backmehl. 10 g ungesüßter Kakao.","22 cm Form.","Im vorgeheizten Backofen bei 170 °C etwa 25 Minuten backen.","1:37 Teigzubereitung für Crêpes","180 g Mehl. 35g ungesüßter Kakao.","Eine Prise Salz. 10 g Zucker.","3 Eier.","260 g warme Milch.","160 g kochendes Wasser.","Durch ein Sieb passieren, damit keine Klümpchen entstehen.","60 g flüssiger Honig. 25 g Pflanzenöl.","Mit Stretchfolie abdecken und den Teig 20 Minuten ruhen lassen.","Fetten Sie die Bratpfanne mit Pflanzenöl ein. Bei mittlerer Hitze von beiden Seiten backen.","3:47 Zubereitung der Creme","250 g Frischkäse. 45 g Puderzucker. 150 g dicker griechischer Joghurt.","250 g Sahne 33 %. 45 g Puderzucker.","20 g flüssiger Honig.","Wir wickeln nacheinander drei Pfannkuchen ein, so wie ich es tue.","Jetzt wenden wir jeden Pfannkuchen auf diese Weise an.","Für 3-4 Stunden, besser noch über Nacht, in den Kühlschrank stellen, damit der Kuchen gut durchnässt ist.","Vor dem Servieren mit Puderzucker bestäuben.","Der Kuchen ist super geworden und sehr lecker.","Freunde, lasst mich in den Kommentaren wissen, wie euch dieser Kuchen gefällt? Es ist mir sehr wichtig, Ihre Meinung zu erfahren!","7:27 Das fertige Ergebnis."],"src":"video description (German; quantities are given inline with the steps)"},{"id":"yt-1szs8RMlhN8","s":"y","t":"1 carrot with 1 egg! your kids will be asking for this for breakfast everyday","o":"1 carrot with 1 egg! your kids will be asking for this for breakfast everyday","c":"Cooking Everyday","cat":"Eggs & Breakfast","st":"full","u":"https://www.youtube.com/watch?v=1szs8RMlhN8","th":"https://i.ytimg.com/vi/1szs8RMlhN8/mqdefault.jpg","p":["Add 200g cooked rice to a bowl","Crack 1 egg in the rice","Mix well","Medium heat","Pour olive oil in the pan","Chop 1/2 onion","Add to the pan","Stir fry for 2 minutes","Chop 1 carrot","Stir fry for 3-5 minutes","Add to the bowl","Add 1tbsp all purpose flour","Add 2tbsp parmesan cheese","Add salt and black pepper","Add a pinch of crushed red pepper","Mix well","Add bread crumbs to a plate","Scoop the rice into balls","Dip the rice in the bread crumbs","Repeat","Pour olive oil in the pan","Place the rice balls into the pan","Fry for 3-5 minutes on medium heat","Done!"],"src":"video description (quantities are given inline with the steps)"},{"id":"yt-b-qahvN4fO4","s":"y","t":"Michelin Chefs Secret to PERFECT Medium Rare Fish","o":"Michelin Chefs Secret to PERFECT Medium Rare Fish","c":"Fallow","cat":"Seafood","st":"partial","u":"https://www.youtube.com/watch?v=b-qahvN4fO4","th":"https://i.ytimg.com/vi/b-qahvN4fO4/mqdefault.jpg","i":["Fish fillet","Oil","Aromatics"],"p":["Cure the fish for a day, then wrap it tightly.","Put it in oil with a few aromatics.","Cook in a 45°C steam oven for about 10-15 minutes.","Rest under heat lamps until the internal temperature reaches 42°C."],"src":"captions (auto-subtitles) (technique; no quantities)"},{"id":"yt-I4Szo0odIDo","s":"y","t":"Why Is Chinese Restaurant Beef Always So Tender? The Secret Revealed!","o":"Why Is Chinese Restaurant Beef Always So Tender? The Secret Revealed!","c":"Sam's Easy Tasty Dishes","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=I4Szo0odIDo","th":"https://i.ytimg.com/vi/I4Szo0odIDo/mqdefault.jpg","i":["Beef: 2 lbs (lean cut, less fat and connective tissue)","Baking Soda: 1.5 tsp","Sugar: 1.5 tsp","Salt: 1 tsp","MSG: 1/2 tsp","Ice Water: 12 oz","Egg White: 1","Cornstarch: 3 tbsp","Soy Sauce: 1 tbsp","Sugar: 1/4 tsp","White Pepper: 1/8 tsp","Dark Soy Sauce: 1 tsp","Shaoxing Wine: 1 tbsp","Oyster Sauce: 1/2 tbsp","Water: 2 tbsp","Cornstarch: 1 tsp","Ginger: A few slices","Garlic: A few slices","Green Onions: White part (for stir-frying) and tops (for garnish)","Cooking Oil: As needed"],"p":["Choose a lean cut of beef. Slice against the grain into thin pieces (2-3 mm thick). For easier slicing, freeze the beef for about an hour before cutting.","In a bowl, mix baking soda, sugar, salt, MSG, and ice water until dissolved.","Add the beef and mix by hand until it feels sticky. Gradually add the ice water in 4-5 batches, mixing after each addition until the beef is hydrated and shiny.","Add the egg white and mix evenly. Then, add cornstarch and coat the beef evenly. Cover and let it rest for 30 minutes.","In a bowl, combine soy sauce, sugar, white pepper, dark soy sauce, Shaoxing wine, oyster sauce, water, and cornstarch. Mix until smooth and set aside.","Heat oil in a pan. Add the marinated beef and sear on both sides until the surface changes color. Cook to medium-well (70-80% done). Remove the beef and set aside to drain.","In the same pan, add ginger slices and cook until fragrant. Next, add garlic slices and the white part of the green onions. Stir-fry until aromatic.","Return the cooked beef to the pan and pour in the sauce. Turn the heat to high and stir-fry quickly, ensuring the beef is evenly coated.","Sprinkle the green onion tops into the pan and give it a quick stir.","Serve immediately and enjoy your flavorful ginger and scallion beef stir-fry!"],"src":"video description"},{"id":"yt-mGa9EJ_XUfw","s":"y","t":"2 Sauces for Duck | Champagne and Berry Sauce for Duck | Pear and Cranberry Sauce for Duck","o":"2 Sauces for Duck | Champagne and Berry Sauce for Duck | Pear and Cranberry Sauce for Duck","c":"The Sauce and Gravy Channel","cat":"Sauces","st":"partial","u":"https://www.youtube.com/watch?v=mGa9EJ_XUfw","th":"https://i.ytimg.com/vi/mGa9EJ_XUfw/mqdefault.jpg","i":["## Champagne and berry sauce","1/4 cup or 63ml dry Champagne (I used extra dry you can substitute with white wine)","1/4 cup or 45g raspberries and black berries","2 sprigs of rosemary","1/2 cup or 125ml chicken stock","1/2 tbsp or 8g light brown sugar","1/2 tbsp or 18g veal demi-glace","Dash of salt and pepper to taste","1/2 tbsp or 7ml apple cider vinegar","## Pear and cranberry sauce","1/4 cup or 63ml red wine","1/8 cup or 12g cranberries","1/8 cup or 22g diced pear","1/2 tsp allspice","1/2 cup or 125ml chicken stock","1/2 tbsp or 8g light brown sugar","1/2 tbsp or 18g veal demi-glace","1/2 tbsp or 7ml balsamic vinegar","Dash of salt and pepper to taste"],"src":"video description"},{"id":"yt-wiCf8WEZKPQ","s":"y","t":"Steak Diane Ribeye Recipe | Chef Jean-Pierre","o":"Steak Diane Ribeye Recipe | Chef Jean-Pierre","c":"Chef Jean-Pierre","cat":"Meats","st":"full","u":"https://www.youtube.com/watch?v=wiCf8WEZKPQ","th":"https://i.ytimg.com/vi/wiCf8WEZKPQ/mqdefault.jpg","i":["2 Ribeye Steaks, about 1 to 1 ½ inch thick","2 teaspoons Avocado Oil or Clarified Butter","Salt and Black pepper to taste","2 Shallots, finely chopped","8 ounces Mushrooms, sliced","3 Garlic Cloves, minced","1 teaspoon Tarragon, freshly chopped","1 teaspoon Thyme, freshly chopped","2 tablespoons Worcestershire Sauce","1 ½ cup Beef Stock","2 tablespoons Cognac","2 tablespoons Corn Starch diluted in water if needed","4 tablespoons Unsalted Butter","2 servings Potato Anna","4 - 6 Stalks Broccolini","Garlic Olive Oil"],"p":["If you have some time, begin by salting the ribeye steaks and allowing them to sit uncovered in the refrigerator overnight. If you do not have time just salt them just before cooking.","Heat avocado oil in a stainless steel fry pan over high heat and sear the steaks until they develop a golden crust on one side.  Flip them on other side and transfer them to the oven to finish cooking to your desired temperature.","In a reduction sauce pan, sauté shallots until they are transparent (a couple minutes) Add mushrooms and cook until they are render ALL their water.","Add garlic, fresh herbs, Worcestershire sauce and beef stock.  Fix the sauce consistency if needed and bring to boil.  Turn the heat off and finish the sauce with extra butter.","Remove the steak from the oven and let them rest on your cutting board.  Deglaze the pan with the Cognac and add it to the sauce.","Blanch the broccolini in boiling water, then sauté with garlic in olive oil until vibrant and tender.","To serve: Arrange the Steaks with Pommes Anna and Broccolini, add a generously drizzle of the sauce.","This elegant dish is a beautiful symphony of flavors that makes it perfect for any special occasion."],"src":"linked recipe page","su":"https://chefjeanpierre.com/recipes/mains/steak-diane-ribeye/","sv":"2 servings"},{"id":"yt-N-p3msgSZHQ","s":"y","t":"Short Rib Ragu A Family Recipe! | Chef Jean-Pierre","o":"Short Rib Ragu A Family Recipe! | Chef Jean-Pierre","c":"Chef Jean-Pierre","cat":"Pasta","st":"full","u":"https://www.youtube.com/watch?v=N-p3msgSZHQ","th":"https://i.ytimg.com/vi/N-p3msgSZHQ/mqdefault.jpg","i":["4 Short Ribs 1,000g","½ pound Bacon sliced into ½ inch pieces","1 large Onion diced","1 cup All-Purpose Flour (for dusting)","Salt and Pepper to taste","1 ½ tablespoons Garlic Olive Oil (for sautéing)","2 tablespoons Garlic chopped","1 bottle 750ml Red Wine (Chianti or a good French cab recommended)","1 ½ cups Carrots","3-4 Celery Stalks","1 28 oz can Canned Peeled Tomatoes","1 ½ tablespoon Fresh Thyme","1 cup Beef Stock: As needed","Pappardelle Pasta: As needed or your choice of pasta","Fresh Parsley: For garnish","Parmesan Cheese: For garnish"],"p":["Season the short ribs with salt and pepper and dust them with the seasoned flour.","In a large oven-proof pot, slowly sauté the bacon over low heat, allowing the fat to render without burning the lean part.","In a separate frying pan, at medium heat, heat the olive oil and sauté the short ribs until they develop a beautiful Maillard reaction, ensuring they're well-browned on all sides.","In the pot with bacon fat, add the diced onion and cook until caramelized.  Once the onions are caramelized, add garlic. Cook until fragrant (one or two minutes) Deglaze the pot with red wine, carrots, celery, ensuring to reduce the wine by half.","Add tomatoes (crushed by hand) to the pot. Season with fresh thyme. Add the browned short ribs back into the pot. Pour in enough beef stock to almost cover the ribs.","Bring the mixture to a simmer, cover with a lid, and place it in the preheated oven. Cook for approximately 2.5 to 3 hours, or until the meat falls off the bone.","While the ragu is cooking, prepare the pappardelle pasta (or pasta of your choice) according to the package instructions.","Once cooked, remove the pot from the oven. Skim off any excess fat from the surface.","Gently remove the bones and any cartilage from the short ribs. Shred the meat and return it to the pot, mixing it into the sauce.","Toss the cooked pasta with the ragu until well coated. Serve hot, garnished with freshly chopped parsley and grated Parmesan cheese."],"src":"linked recipe page","su":"https://chefjeanpierre.com/recipes/pasta/short-rib-ragu-recipe/","sv":"4 servings"},{"id":"yt-2fv0ZncA3iw","s":"y","t":"계란 2개로 만드는 수플레 오믈렛, 입안 가득 사르륵 녹는 계란요리","o":"계란 2개로 만드는 수플레 오믈렛, 입안 가득 사르륵 녹는 계란요리","c":"여니쿡 Yeoni cook","cat":"Eggs & Breakfast","st":"partial","u":"https://www.youtube.com/watch?v=2fv0ZncA3iw","th":"https://i.ytimg.com/vi/2fv0ZncA3iw/mqdefault.jpg","i":["계란 2개 — 2 eggs","설탕 1큰술 — 1 tbsp sugar","소금 조금 — a little salt","식용유 — cooking oil (unsalted butter is even better)"],"p":["Pan used: 24 cm top diameter. Egg whites whipped with a hand mixer."],"src":"video description (Korean)"},{"id":"yt-RaLzxZryEoA","s":"y","t":"Turn 2 Eggs Into Fluffy Japanese Soufflé Pancakes!","o":"Turn 2 Eggs Into Fluffy Japanese Soufflé Pancakes!","c":"Whisk Takers","cat":"Eggs & Breakfast","st":"partial","u":"https://www.youtube.com/watch?v=RaLzxZryEoA","th":"https://i.ytimg.com/vi/RaLzxZryEoA/mqdefault.jpg","i":["2 middle eggs","4 tsp milk (20 ml)","2-3 tbsp cake flour. All-purpose flour works too.","1/2 tsp vanilla extract","3 tsp sugar."],"p":["Cook over low heat.","Whisk the egg whites to stiff peaks, but don't overdo it!","Gradually mix the flour into the yolks until you get a nice, creamy batter.","Fold the beaten whites into the yolk mixture with a spatula—no mixer needed!","Make sure the frying pan is evenly heated before you start."],"src":"video description"},{"id":"yt-USgGq4KNBe0","s":"y","t":"Fisher Nuts Classic Banana Bread","o":"Fisher Nuts Classic Banana Bread","c":"Fisher Nuts","cat":"Breads","st":"full","u":"https://www.youtube.com/watch?v=USgGq4KNBe0","th":"https://i.ytimg.com/vi/USgGq4KNBe0/mqdefault.jpg","i":["2 cups all-purpose white flour","1 1/4 teaspoons baking powder","1/2 teaspoon ground cinnamon","1/2 cup unsalted butter, softened","1 cup granulated sugar","2 eggs","1 teaspoon vanilla extract","3 ripe bananas","1 cup chopped walnuts (Fisher)","Non-stick cooking spray for the loaf pan"],"p":["Preheat the oven to 350°F and spray a loaf pan with non-stick cooking spray.","Combine the flour, baking powder and cinnamon thoroughly; set aside.","Cream the butter and sugar on medium speed until fluffy.","Mix in the 2 eggs and the vanilla.","Add the bananas and let the mixer mash them in.","Add the dry ingredients one third at a time, mixing well between additions and scraping the bowl (do not overmix).","Fold in the chopped walnuts.","Scrape into the loaf pan, spread evenly and give it a shake to release air bubbles.","Bake about 55-60 minutes, until evenly brown and pulling away from the sides (a toothpick should come out clean).","Cool 10 minutes, loosen the sides, turn out onto a rack and cool completely before slicing."],"src":"video description (the description carries the full spoken transcript; quantities and steps condensed from it)"},{"id":"yt-Qm7nrjostEs","s":"y","t":"Tiramisu-Bällchen! Ein hausgemachtes Dessert, das nicht gebacken werden muss!","o":"Tiramisu-Bällchen! Ein hausgemachtes Dessert, das nicht gebacken werden muss!","c":"Desserts by Alex","cat":"Desserts","st":"partial","u":"https://www.youtube.com/watch?v=Qm7nrjostEs","th":"https://i.ytimg.com/vi/Qm7nrjostEs/mqdefault.jpg","i":["300 g - Löffelbiskuits(10,58 oz)","170 g - Mascarpone (5.99 oz)","40 g - Puderzucker (1.41 oz)","50 ml - Kaffee(1.69 fl oz)","1 - Mandarine","180 g - Zartbitterschokolade(6.34 oz)","30 ml - Pflanzenöl (1.01 fl oz)"],"p":["Balls are about 5-5.5 cm (2 in) in diameter."],"src":"video description (German)"},{"id":"yt-KLc61N7mN6w","s":"y","t":"Souffle Recipe | How To Make A Souffle","o":"Souffle Recipe |
